<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaLune CAPTCHA Bridge — настройки</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; color: #202124; }
    label { display: block; margin: 22px 0 8px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 11px; font: inherit; }
    button { margin-top: 14px; padding: 10px 18px; font: inherit; cursor: pointer; }
    .hint { color: #5f6368; font-size: 13px; }
    #status { min-height: 1.5em; margin-top: 14px; }
  </style>
</head>
<body>
  <h1>LaLune CAPTCHA Bridge</h1>
  <p>Укажите точный origin панели LaLune, куда разрешено возвращать результат CAPTCHA.</p>
  <label for="origin">Адрес панели (origin)</label>
  <input id="origin" type="url" placeholder="https://nanopi.example.com или http://192.168.1.10:47002" autocomplete="url">
  <p class="hint">Указывайте только схему, имя/IP и порт — без пути, параметров и фрагмента. HTTPS разрешён для публичных адресов. HTTP разрешён только для localhost, локальных имён .local и частных IP-адресов.</p>
  <button id="save" type="button">Сохранить</button>
  <button id="clear" type="button">Удалить настройку</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="origin-policy.js"></script>
  <script src="options.js"></script>
</body>
</html>
