name: Build original LaLune Web UI

on:
  workflow_dispatch:
  push:
    branches:
      - original-lalune-web-arm64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adaptation
        uses: actions/checkout@v4

      - name: Clone upstream LaLune
        run: git clone --depth 1 https://github.com/Endlad2/LaLune.git upstream-lalune

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare and build original Flutter web UI
        run: bash adapt/build-original-web.sh upstream-lalune

      - name: Package web UI
        run: |
          tar -C upstream-lalune/Frontend/build -czf lalune-web-arm64.tar.gz web
          sha256sum lalune-web-arm64.tar.gz > SHA256SUMS

      - name: Publish web tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch lalune-web-dist https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git web-dist
          rm -rf web-dist/*
          cp -a upstream-lalune/Frontend/build/web/. web-dist/
          cd web-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: original LaLune web UI ${GITHUB_SHA}" || true
          git push origin lalune-web-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lalune-web-arm64
          path: |
            lalune-web-arm64.tar.gz
            SHA256SUMS
