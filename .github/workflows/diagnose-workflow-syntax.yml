name: Diagnose GitHub Actions workflow syntax

on:
  push:
    branches:
      - fix/socks5-dns-udp-health-e2e
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/actionlint" -version
      - name: Validate both production workflows
        run: |
          set -euo pipefail
          $(go env GOPATH)/bin/actionlint -color -ignore 'shellcheck' -verbose .github/workflows/build-original-linux-arm64.yml .github/workflows/csqtt-lalune-arm64-vm-test.yml
