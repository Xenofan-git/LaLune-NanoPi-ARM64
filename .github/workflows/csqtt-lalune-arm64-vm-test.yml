            sudo ip route add blackhole 198.18.78.0/24 table 470010
            sudo ip rule add priority 470010 to 198.18.78.0/24 lookup 470010
            sudo ip rule add priority 470011 fwmark 0x67410/0xffff lookup 470010
            sudo iptables -I OUTPUT 1 -d 198.18.78.0/24 -m comment --comment CSQTT_LALUNE-FOREIGN_RULE_KEEP -j ACCEPT
            sudo iptables -I OUTPUT 1 -d 198.18.79.0/24 -m comment --comment CSQTT_LALUNEISH_FOREIGN_KEEP -j ACCEPT
