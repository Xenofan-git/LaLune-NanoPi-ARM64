      - name: Upload guest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lalune-arm64-system-vm-diagnostics
          path: |
            vm/serial.log
            vm/user-data
            vm/meta-data
          if-no-files-found: ignore

      - name: Stop QEMU guest
        if: always()
        run: |
          if [ -f vm/qemu.pid ]; then kill "$(cat vm/qemu.pid)" || true; fi
