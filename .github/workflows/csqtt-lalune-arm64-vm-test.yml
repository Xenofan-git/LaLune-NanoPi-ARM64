            sudo sha256sum -c /tmp/production-units.before
            sudo systemctl show -p ActiveState -p SubState csqtt.service csqtt-47000.service csqtt-47000-netns.service > /tmp/production-states.after-uninstall
            diff -u /tmp/production-states.before /tmp/production-states.after-uninstall
            sudo sha256sum -c /tmp/production-sysctl.before
            sudo ip -4 route show table 42424 > /tmp/foreign-routes.after-uninstall
            diff -u /tmp/foreign-routes.before /tmp/foreign-routes.after-uninstall
            sudo ip -4 route show table 470010 > /tmp/near-miss-routes.after-uninstall
            diff -u /tmp/near-miss-routes.before /tmp/near-miss-routes.after-uninstall
            sudo ip -4 rule show > /tmp/all-ip-rules.after-uninstall
            while IFS= read -r rule; do grep -Fqx -- "$rule" /tmp/all-ip-rules.after-uninstall; done < /tmp/all-ip-rules.before
            sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\[[0-9:]*\]/[COUNTERS]/g" | python3 -c "import re,sys; s=sys.stdin.read(); s=re.sub(r\"(?ms)^\\*(?:mangle|nat)\\n(?:(?::[A-Z0-9_-]+ ACCEPT \\[COUNTERS\\])\\n)+COMMIT\\n\", \"\", s); sys.stdout.write(s)" > /tmp/iptables.after-uninstall
            for marker in CSQTT_LALUNE_MIRRORED CSQTT_LALUNE_TPROXY CSQTT_LALUNE_LOCAL_SOCKS CSQTT_LALUNE_LOCAL_SOCKS_MARK CSQTT_LALUNE_SOCKS CSQTT_LALUNE_CASCADE_NO_QUIC; do ! grep -Fq "$marker" /tmp/iptables.after-uninstall; done
            grep -Fq "CSQTT_LALUNE-FOREIGN_RULE_KEEP" /tmp/iptables.after-uninstall
            grep -Fq "CSQTT_LALUNEISH_FOREIGN_KEEP" /tmp/iptables.after-uninstall
            sudo ip -4 route show table main > /tmp/main-routes.after-uninstall
            sudo diff -u /tmp/main-routes.before /tmp/main-routes.after-uninstall
            sudo ip -4 rule show > /tmp/ip-rules.after-uninstall
            sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\[[0-9:]*\]/[COUNTERS]/g" | python3 -c "import re,sys; s=sys.stdin.read(); s=re.sub(r\"(?ms)^\\*(?:mangle|nat)\\n(?:(?::[A-Z0-9_-]+ ACCEPT \\[COUNTERS\\])\\n)+COMMIT\\n\", \"\", s); sys.stdout.write(s)" > /tmp/iptables.after-uninstall
            diff -u /tmp/ip-rules.before /tmp/ip-rules.after-uninstall
            diff -u /tmp/iptables.before /tmp/iptables.after-uninstall
            sudo test -f /etc/csqtt-lalune/csqtt.db
            sudo test -f /etc/csqtt-lalune/csqtt.env
            echo ORIGINAL_DEPLOY_SH_ARM64_SYSTEM_VM_LIFECYCLE_PASS'
      - name: End-to-end test of the actual Deploy button API against disposable ARM64 VM
        timeout-minutes: 35
        run: |
          set -Eeuo pipefail
          mkdir -p vm/deploy-e2e-home
          ip -4 route show table main > vm/runner-main-routes.before
          ip -4 rule show > vm/runner-ip-rules.before
          export HOME="$GITHUB_WORKSPACE/vm/deploy-e2e-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          # The E2E backend runs outside systemd, so provide the same mandatory
          # per-install credential explicitly. This is a disposable test secret.
          export LALUNE_PANEL_PASSWORD="ci-panel-password-for-isolated-vm"
          cd vm/real/deploy-e2e
          ./lalune-original-linux-amd64 > "$GITHUB_WORKSPACE/vm/deploy-e2e-backend.log" 2>&1 &
          BACKEND_PID=$!
          cleanup_backend() { kill -KILL "$BACKEND_PID" 2>/dev/null || true; wait "$BACKEND_PID" 2>/dev/null || true; }
          trap cleanup_backend EXIT
          cd "$GITHUB_WORKSPACE"
          for attempt in $(seq 1 60); do
            if curl -fsS -u admin:ci-panel-password-for-isolated-vm http://127.0.0.1:1062/deploy/status >/dev/null; then break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then cat vm/deploy-e2e-backend.log; exit 1; fi
            sleep 1
          done
          curl -fsS -u admin:ci-panel-password-for-isolated-vm http://127.0.0.1:1062/deploy/status >/dev/null
          python3 - <<'PY'
          import base64, json, os, urllib.request
          payload = {
              "protocol": "CSQTT",
              "host": "127.0.0.1",
              "sshPort": 2222,
              "user": "tester",
              "usePassword": False,
              "password": "",
              "keyPath": os.path.abspath("vm/id_ed25519"),
              "manualPorts": False,
              "corePort": 47000,
              "warpPort": 47002,
              "listenPort": 0,
              "mainPassword": "deployMain123",
              "webUser": "deployWeb123",
              "webPassword": "deployPass123",
              "deviceId": "01234567-89ab-cdef-0123-456789abcdef",
              "dockerInstall": False,
              "uninstall": False,
          }
          req = urllib.request.Request(
              "http://127.0.0.1:1062/deploy",
              data=json.dumps(payload).encode(),
              headers={
              "Content-Type": "application/json",
              "Authorization": "Basic " + base64.b64encode(b"admin:ci-panel-password-for-isolated-vm").decode(),
              "Origin": "http://127.0.0.1:1062",
          },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise SystemExit("Deploy button API refused the deployment request")
          print("DEPLOY_BUTTON_API_ACCEPTED")
          PY
          deploy_done=0
          for attempt in $(seq 1 600); do
            status="$(curl -fsS -u admin:ci-panel-password-for-isolated-vm http://127.0.0.1:1062/deploy/status)"
            if python3 -c 'import json,sys; raise SystemExit(0 if not json.load(sys.stdin).get("deploying", True) else 1)' <<<"$status"; then
              deploy_done=1
              break
            fi
            sleep 2
          done
          [[ "$deploy_done" == 1 ]] || { cat vm/deploy-e2e-backend.log; exit 1; }
          deploy_log="$(curl -fsS -u admin:ci-panel-password-for-isolated-vm http://127.0.0.1:1062/deploy/log | python3 -c 'import json,sys; print(json.load(sys.stdin))')"
          printf '%s\n' "$deploy_log"
          grep -Fq 'CSQTT_LALUNE_DEPLOY_OK' <<<"$deploy_log"
          grep -Fq 'PANEL_URL=https://127.0.0.1:47002' <<<"$deploy_log"
          ssh -i vm/id_ed25519 -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null tester@127.0.0.1 'sudo systemctl is-active --quiet csqtt-lalune.service && sudo grep -Fq "CSQTT_WEB_USER=deployWeb123" /etc/csqtt-lalune/csqtt.env && sudo grep -aFq "01234567-89ab-cdef-0123-456789abcdef" /etc/csqtt-lalune/csqtt.db && sudo systemctl is-active --quiet csqtt.service && sudo systemctl is-active --quiet csqtt-47000.service && sudo systemctl is-active --quiet csqtt-47000-netns.service && sudo ss -H -lun "sport = :47000" | grep -q . && sudo ss -H -ltn "sport = :47002" | grep -q . && sudo systemctl show -p ActiveState -p SubState csqtt.service csqtt-47000.service csqtt-47000-netns.service > /tmp/production-states.after-button-install && diff -u /tmp/production-states.before /tmp/production-states.after-button-install && sudo ip -4 route show table main | grep -vF "10.67.68.0/24 dev csqtt-lalune0" > /tmp/main-routes.after-button-install.unrelated && diff -u /tmp/main-routes.before /tmp/main-routes.after-button-install.unrelated && sudo ip -4 rule show > /tmp/ip-rules.after-button-install && diff -u /tmp/ip-rules.after-install /tmp/ip-rules.after-button-install && sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\\[[0-9:]*\\]/[COUNTERS]/g" > /tmp/iptables.after-button-install && diff -u /tmp/iptables.after-install /tmp/iptables.after-button-install && sudo ip -4 route show table 470010 > /tmp/near-miss-routes.after-button-install && diff -u /tmp/near-miss-routes.before /tmp/near-miss-routes.after-button-install'
          python3 - <<'PY'
          import base64, json, os, urllib.request
          payload = {
              "protocol": "CSQTT",
              "host": "127.0.0.1",
              "sshPort": 2222,
              "user": "tester",
              "usePassword": False,
              "password": "",
              "keyPath": os.path.abspath("vm/id_ed25519"),
              "manualPorts": False,
              "corePort": 47000,
              "warpPort": 47002,
              "listenPort": 0,
              "uninstall": True,
          }
          req = urllib.request.Request(
              "http://127.0.0.1:1062/deploy",
              data=json.dumps(payload).encode(),
              headers={
