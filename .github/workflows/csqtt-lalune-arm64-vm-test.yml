name: CSQTT LaLune ARM64 system VM lifecycle test

on:
  workflow_call:

permissions:
  contents: read
  actions: read

# Passed only to this isolated disposable VM; never printed or packaged.

jobs:
  arm64-system-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download actual ARM64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: lalune-original-linux-arm64
          path: vm/artifact

      - name: Extract actual isolated server and installer
        run: |
          set -euxo pipefail
          test -s vm/artifact/lalune-original-linux-arm64.tar.gz
          mkdir -p vm/real
          tar -xzf vm/artifact/lalune-original-linux-arm64.tar.gz -C vm/real
          test -s vm/real/server-assets/csqtt-lalune-linux-arm64
          test -x vm/real/server-assets/deploy-csqtt-lalune.sh
          test -s vm/real/client-linux-arm64
          test -x vm/real/socks5-marked-e2e-arm64.test
          grep -Fxq 'CSQTT-WIRE-4' vm/real/CSQTT_SERVER_PROTOCOL
          grep -Fq 'source=Endlad2/csqtt-core@3eafb7ee868f5f2690edf3b0326153813f88eb5f' vm/real/CSQTT_CLIENT_VERSION
          grep -Fq 'patch=rjs-manual-captcha-fallback-v1' vm/real/CSQTT_CLIENT_VERSION
          grep -Fq 'recovery=negotiated-wire-4-liveness-v1' vm/real/CSQTT_CLIENT_VERSION
          strings -a vm/real/client-linux-arm64 | grep -Fq 'CSQTT_LIVENESS_V1'
          sha256sum vm/real/client-linux-arm64
          file vm/real/client-linux-arm64
          test -x vm/real/client-tun-tests-arm64
          test -x vm/real/deploy-e2e/lalune-original-linux-amd64
          test -x vm/real/deploy-e2e/deploy-manager
          test -x vm/real/deploy-e2e/server-assets/deploy-csqtt-lalune.sh
          test -x vm/real/deploy-e2e/server-assets/csqtt-lalune-linux-arm64
          test -x vm/real/deploy-e2e/server-assets/csqtt-lalune-linux-amd64
          file vm/real/deploy-e2e/lalune-original-linux-amd64 | grep -Eq 'x86-64|x86_64'
          file vm/real/deploy-e2e/deploy-manager | grep -Eq 'x86-64|x86_64'
          file vm/real/server-assets/csqtt-lalune-linux-arm64
          sha256sum vm/real/server-assets/csqtt-lalune-linux-arm64

      - name: Install QEMU system emulator and cloud-init image tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 cloud-image-utils openssh-client

      - name: Prepare isolated Debian ARM64 guest
        run: |
          set -euxo pipefail
          mkdir -p vm
          curl -fL --retry 3 https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2 -o vm/guest.qcow2
          ssh-keygen -q -t ed25519 -N '' -f vm/id_ed25519
          cat > vm/user-data <<'EOF'
          #cloud-config
          users:
            - name: tester
              groups: [sudo]
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - KEY_PLACEHOLDER
          ssh_pwauth: false
          package_update: true
          packages:
            - iproute2
            - iptables
            - iptables-persistent
            - nftables
            - dnsmasq-base
            - systemd
            - openssh-server
            - python3-cryptography
          EOF
          sed -i "s|KEY_PLACEHOLDER|$(cat vm/id_ed25519.pub)|" vm/user-data
          cat > vm/meta-data <<'EOF'
          instance-id: lalune-isolation-test
          local-hostname: lalune-arm64-test
          EOF
          cloud-localds vm/seed.iso vm/user-data vm/meta-data
          qemu-img resize vm/guest.qcow2 8G

      - name: Boot real ARM64 Linux guest
        run: |
          set -euxo pipefail
          test -f /usr/share/AAVMF/AAVMF_CODE.fd
          cp /usr/share/AAVMF/AAVMF_CODE.fd vm/firmware-code.fd
          cp /usr/share/AAVMF/AAVMF_VARS.fd vm/firmware-vars.fd
          qemu-system-aarch64 \
            -machine virt -cpu max -m 3072 -smp 2 -accel tcg \
            -drive if=pflash,format=raw,readonly=on,file=vm/firmware-code.fd \
            -drive if=pflash,format=raw,file=vm/firmware-vars.fd \
            -drive if=none,file=vm/guest.qcow2,format=qcow2,id=hd0 \
            -device virtio-blk-device,drive=hd0 \
            -drive file=vm/seed.iso,if=none,format=raw,id=seed \
            -device virtio-blk-device,drive=seed \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none -monitor none -daemonize -pidfile vm/qemu.pid -serial file:vm/serial.log
          for attempt in $(seq 1 90); do
            if ssh -i vm/id_ed25519 -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 tester@127.0.0.1 'uname -m' 2>/dev/null | grep -qx aarch64; then
              exit 0
            fi
            sleep 5
          done
          cat vm/serial.log
          exit 1

      - name: Run real SOCKS5 TCP and UDP SO_MARK policy-routing E2E in isolated ARM64 VM
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          SSH=(ssh -i vm/id_ed25519 -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null tester@127.0.0.1)
          SCP=(scp -i vm/id_ed25519 -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          "${SCP[@]}" vm/real/socks5-marked-e2e-arm64.test tester@127.0.0.1:/home/tester/socks5-marked-e2e-arm64.test
          "${SSH[@]}" 'sudo bash -se' <<'SOCKS_MARKED_E2E'
          set -Eeuxo pipefail
          trap 'rc=$?; echo "REMOTE_E2E_FAILURE line=${LINENO} rc=${rc} command=${BASH_COMMAND}" >&2; ip -br addr >&2 || true; ip -4 rule show >&2 || true; ip -4 route show table all >&2 || true; exit "$rc"' ERR
          RESOLV_BACKUP=/tmp/resolv.conf.socks5-e2e.backup
          cleanup() {
            if [ -f "$RESOLV_BACKUP" ]; then cat "$RESOLV_BACKUP" > /etc/resolv.conf; rm -f "$RESOLV_BACKUP"; fi
            pkill -f '/tmp/socks5-echo.py' 2>/dev/null || true
            ip rule del pref 100 fwmark 0x4d53/0xffff lookup 202 2>/dev/null || true
            ip route del blackhole 198.18.86.2/32 2>/dev/null || true
            ip route del 198.18.86.2/32 via 198.18.0.2 dev csqtt0 table 202 2>/dev/null || true
            ip link del csqtt0 2>/dev/null || true
            ip link del eth1 2>/dev/null || true
            ip netns del socks-echo 2>/dev/null || true
          }
          cleanup
          cp /etc/resolv.conf "$RESOLV_BACKUP"
          trap cleanup EXIT
          ip netns add socks-echo
          ip link add csqtt0 type veth peer name socks-peer
          ip link set socks-peer netns socks-echo
          ip addr add 198.18.0.1/30 dev csqtt0
          ip link set csqtt0 up
          # csqtt0 is an asymmetric policy-routing egress: the reverse route
          # for replies exists in table 202, while main has an intentional
          # blackhole. Disable reverse-path filtering only on this test link.
          sysctl -w net.ipv4.conf.all.rp_filter=0
          sysctl -w net.ipv4.conf.default.rp_filter=0
          sysctl -w net.ipv4.conf.csqtt0.rp_filter=0
          echo "RP_FILTER all=$(sysctl -n net.ipv4.conf.all.rp_filter) csqtt0=$(sysctl -n net.ipv4.conf.csqtt0.rp_filter)"
          ip link add eth1 type dummy
          ip addr add 10.67.68.1/24 dev eth1
          ip link set eth1 up
          ip -n socks-echo link set lo up
          ip -n socks-echo addr add 198.18.0.2/30 dev socks-peer
          ip -n socks-echo addr add 198.18.86.2/32 dev lo
          ip -n socks-echo link set socks-peer up
          ip -n socks-echo route add 10.67.68.1/32 via 198.18.0.1 dev socks-peer
          # The unmarked main-table route is an explicit blackhole. Only the
          # SOCKS5 production SO_MARK value can select table 202 and reach echo.
          ip route add blackhole 198.18.86.2/32
          # Table 202 needs its own connected route so the kernel can validate
          # the next hop before accepting the marked destination route.
          ip route add 198.18.0.0/30 dev csqtt0 scope link table 202
          ip route add 198.18.86.2/32 via 198.18.0.2 dev csqtt0 table 202
          ip rule add pref 100 fwmark 0x4d53/0xffff lookup 202
          # cloud-init/systemd-sysctl in the guest may reapply distro defaults
          # after the veth was created. Reassert and verify the test-only
          # setting immediately before starting packet-level assertions.
          sysctl -w net.ipv4.conf.all.rp_filter=0
          sysctl -w net.ipv4.conf.default.rp_filter=0
          sysctl -w net.ipv4.conf.csqtt0.rp_filter=0
          test "$(sysctl -n net.ipv4.conf.csqtt0.rp_filter)" = 0
          echo "RP_FILTER_PRE_DNS all=$(sysctl -n net.ipv4.conf.all.rp_filter) default=$(sysctl -n net.ipv4.conf.default.rp_filter) csqtt0=$(sysctl -n net.ipv4.conf.csqtt0.rp_filter)"
          # Do not run an unmarked route lookup here: the intentional main-table
          # blackhole makes ip route get return EINVAL. Marked-path lookup is
          # asserted below after the fixture is ready.
          cat >/tmp/socks5-echo.py <<'PY'
          import socket, threading, struct
          addr="198.18.86.2"
          tcp=socket.socket(); tcp.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); tcp.bind((addr,18080)); tcp.listen(32)
          def handle(c):
              try:
                  while True:
                      b=c.recv(65535)
                      if not b: break
                      c.sendall(b)
              finally: c.close()
          def accept():
              while True:
                  c,_=tcp.accept(); threading.Thread(target=handle,args=(c,),daemon=True).start()
          threading.Thread(target=accept,daemon=True).start()
          udp=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); udp.bind((addr,18081))
          def udp_echo():
              while True:
                  b,a=udp.recvfrom(65535); udp.sendto(b,a)
          threading.Thread(target=udp_echo,daemon=True).start()
          dns=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); dns.bind((addr,53))
          def dns_answer():
              while True:
                  q,peer=dns.recvfrom(2048)
                  print("DNS_RX bytes=%d peer=%r" % (len(q),peer), flush=True)
                  if len(q)<17:
                      print("DNS_DROP short_query", flush=True); continue
                  p=12; labels=[]
                  try:
                      while q[p]:
                          n=q[p]; p+=1; labels.append(q[p:p+n].decode("ascii").lower()); p+=n
                      p+=1
                      qtype,qclass=struct.unpack("!HH",q[p:p+4])
                      question=q[12:p+4]
                      name=".".join(labels)
                      answer=b""
                      if name=="marked.socks.test" and qtype==1 and qclass==1:
                          answer=b"\xc0\x0c"+struct.pack("!HHIH",1,1,60,4)+socket.inet_aton(addr)
                      header=q[:2]+struct.pack("!HHHHH",0x8180,1,1 if answer else 0,0,0)
                      response=header+question+answer
                      sent=dns.sendto(response,peer)
                      print("DNS_TX name=%s qtype=%d bytes=%d peer=%r" % (name,qtype,sent,peer), flush=True)
                  except Exception as exc:
                      print("DNS_HANDLER_ERROR %r" % (exc,), flush=True)
          threading.Thread(target=dns_answer,daemon=True).start()
          threading.Event().wait()
          PY
          ip netns exec socks-echo nohup python3 /tmp/socks5-echo.py >/tmp/socks5-echo.log 2>&1 </dev/null &
          rm -f /etc/resolv.conf
          printf '%s\n' 'nameserver 198.18.86.2' 'options timeout:1 attempts:2' > /etc/resolv.conf
          test -f /etc/resolv.conf
          test ! -L /etc/resolv.conf
          echo 'RESOLV_CONF_E2E_BEGIN'
          cat /etc/resolv.conf

          for n in $(seq 1 30); do
            if ip netns exec socks-echo python3 -c 'import socket;s=socket.socket();s.settimeout(.2);s.connect(("198.18.86.2",18080));s.close()' 2>/dev/null; then break; fi
            sleep 0.2
          done
          # The main-table blackhole is intentional. Linux reports RTNETLINK
          # EINVAL for "ip route get" against an RTN_BLACKHOLE route, so a
          # failed unmarked lookup is the expected isolation result, not a test
          # setup error. Verify the blackhole exists, then require marked lookup
          # to resolve through table 202 and csqtt0.
          ip -4 route show table main type blackhole | grep -Fq 'blackhole 198.18.86.2'
          if ip route get 198.18.86.2 >/tmp/socks5-unmarked-route.log 2>&1; then
            echo "unmarked traffic unexpectedly resolved despite the main-table blackhole" >&2
            cat /tmp/socks5-unmarked-route.log >&2
            exit 1
          else
            unmarked_status=$?
            test "$unmarked_status" -eq 2
            grep -Fq 'RTNETLINK answers: Invalid argument' /tmp/socks5-unmarked-route.log
            echo "UNMARKED_BLACKHOLE_ENFORCED_PASS"
          fi
          marked_route="$(ip route get 198.18.86.2 mark 0x4d53)"
          echo "MARKED_ROUTE: $marked_route"
          grep -q 'table 202' <<<"$marked_route"
          grep -q 'dev csqtt0' <<<"$marked_route"
          ip -4 rule show | grep -Eq 'fwmark 0x4d53/0xffff.*lookup 202'
          ip -4 route show table 202 | grep -Fq '198.18.86.2'
          ip link show dev csqtt0 | grep -q 'state UP'
          # Recheck after fixture startup: no guest service may silently
          # restore reverse-path filtering on the marked return interface.
          sysctl -w net.ipv4.conf.csqtt0.rp_filter=0
          test "$(sysctl -n net.ipv4.conf.csqtt0.rp_filter)" = 0
          echo "RP_FILTER_AT_PROBE all=$(sysctl -n net.ipv4.conf.all.rp_filter) csqtt0=$(sysctl -n net.ipv4.conf.csqtt0.rp_filter)"
          # DNS must itself traverse the marked policy route. Retry briefly
          # for fixture startup and dump both endpoints if the UDP reply is lost.
          python3 - <<'PYDNS'
          import socket,struct,time,subprocess
          q=bytes.fromhex("123401000001000000000000")+b"".join(bytes([len(x)])+x.encode() for x in "marked.socks.test".split("."))+bytes.fromhex("0000010001")
          last=None
          for attempt in range(1,11):
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
              s.setsockopt(socket.SOL_SOCKET,36,0x4d53); s.settimeout(1)
              try:
                  s.sendto(q,('198.18.86.2',53))
                  r,peer=s.recvfrom(512)
                  assert len(r)>len(q) and struct.unpack('!H',r[6:8])[0]==1, r
                  print("MARKED_DNS_UDP_PASS attempt=%d peer=%r response_bytes=%d" % (attempt,peer,len(r)))
                  break
              except Exception as exc:
                  last=exc
                  print("MARKED_DNS_UDP_RETRY attempt=%d error=%r" % (attempt,exc),flush=True)
                  time.sleep(0.25)
              finally:
                  s.close()
          else:
              print("DNS_FIXTURE_LOG_BEGIN",flush=True)
              subprocess.run(["cat","/tmp/socks5-echo.log"],check=False)
              for cmd in (["sysctl","net.ipv4.conf.all.rp_filter","net.ipv4.conf.csqtt0.rp_filter"],["ip","-s","link","show","csqtt0"],["ip","-n","socks-echo","-s","link","show","socks-peer"],["ip","-n","socks-echo","route","show","table","all"],["ip","-4","route","show","table","202"],["ip","-4","rule","show"]):
                  subprocess.run(cmd,check=False)
              raise SystemExit("marked DNS UDP test failed: %r" % (last,))
          PYDNS
          chmod 0755 /home/tester/socks5-marked-e2e-arm64.test
          if CSQTT_SOCKS5_MARKED_E2E=1 CSQTT_SOCKS5_E2E_TARGET=198.18.86.2 /home/tester/socks5-marked-e2e-arm64.test -test.run TestSocks5MarkedSocketEndToEnd -test.v; then
            echo SOCKS5_TCP_UDP_SO_MARK_POLICY_ROUTING_E2E_PASS
          else
            echo "SOCKS5_E2E_FIXTURE_LOG_BEGIN" >&2
            cat /tmp/socks5-echo.log >&2 || true
            echo "SOCKS5_E2E_INTERFACE_COUNTERS_BEGIN" >&2
            ip -s link show csqtt0 >&2 || true
            ip -n socks-echo -s link show socks-peer >&2 || true
            echo "SOCKS5_E2E_NAMESPACE_ROUTES_BEGIN" >&2
            ip -n socks-echo route show table all >&2 || true
            exit 1
          fi
          SOCKS_MARKED_E2E

      - name: Test backend installer lifecycle and ownership safety in disposable ARM64 VM
        run: |
          mkdir -p vm/backend-installer-test/server-assets
          cp vm/real/install-original-linux-backend.sh vm/backend-installer-test/
          cat > vm/backend-installer-test/fake-backend <<'EOF'
          #!/bin/sh
          exec /bin/sleep infinity
          EOF
          cat > vm/backend-installer-test/deploy-manager <<'EOF'
          #!/bin/sh
          exit 0
          EOF
          chmod 0755 vm/backend-installer-test/fake-backend vm/backend-installer-test/deploy-manager
          for asset in deploy-csqtt-lalune.sh csqtt-lalune-linux-arm64 csqtt-lalune-linux-amd64; do
            printf '#!/bin/sh\nexit 0\n' > "vm/backend-installer-test/server-assets/$asset"
            chmod 0755 "vm/backend-installer-test/server-assets/$asset"
          done
          SCP=(scp -i vm/id_ed25519 -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          "${SCP[@]}" -r vm/backend-installer-test tester@127.0.0.1:/home/tester/backend-installer-test
          ssh -i vm/id_ed25519 -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null tester@127.0.0.1 'sudo bash -se' <<'BACKEND_INSTALL_TEST'
          set -euo pipefail
          T=/home/tester/backend-installer-test
          # A foreign DeployManager must cause a fail-closed refusal without alteration.
          printf 'FOREIGN_DEPLOY_MANAGER\n' > /usr/local/bin/deploy-manager
          if sudo sh "$T/install-original-linux-backend.sh" "$T/fake-backend" "$T"; then
            echo "installer unexpectedly overwrote an unowned DeployManager" >&2
            exit 1
          fi
          grep -qx 'FOREIGN_DEPLOY_MANAGER' /usr/local/bin/deploy-manager
          test ! -e /usr/local/lib/lalune/.managed-by-lalune-deploy
          rm -f /usr/local/bin/deploy-manager

          # Run an independent gateway service and prove backend installation leaves it active.
          cat > /etc/systemd/system/lalune-gateway.service <<'UNIT'
          [Unit]
          Description=Independent gateway lifecycle sentinel
          [Service]
          Type=simple
          ExecStart=/bin/sleep infinity
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now lalune-gateway.service
          systemctl is-active --quiet lalune-gateway.service

          sh "$T/install-original-linux-backend.sh" "$T/fake-backend" "$T"
          systemctl is-active --quiet lalune-backend.service
          systemctl is-active --quiet lalune-gateway.service
          grep -Fq 'ExecStart=/usr/local/bin/lalune-backend' /etc/systemd/system/lalune-backend.service
          ! grep -Fq 'Conflicts=lalune-gateway.service' /etc/systemd/system/lalune-backend.service

          # Reinstall/upgrade with an existing ownership marker must be idempotent.
          sh "$T/install-original-linux-backend.sh" "$T/fake-backend" "$T"
          systemctl is-active --quiet lalune-backend.service
          systemctl is-active --quiet lalune-gateway.service
          test "$(cat /usr/local/lib/lalune/.managed-by-lalune-deploy)" = LALUNE-DEPLOY-BUNDLE-V1

          # A symlinked managed executable must be rejected before it is followed/replaced.
          systemctl stop lalune-backend.service
          mv /usr/local/bin/lalune-backend /usr/local/bin/lalune-backend.saved
          ln -s /tmp/foreign-backend /usr/local/bin/lalune-backend
          if sh "$T/install-original-linux-backend.sh" "$T/fake-backend" "$T"; then
            echo "installer unexpectedly accepted a symlink target" >&2
            exit 1
          fi
          test -L /usr/local/bin/lalune-backend
          rm /usr/local/bin/lalune-backend
          mv /usr/local/bin/lalune-backend.saved /usr/local/bin/lalune-backend

          systemctl start lalune-backend.service
          systemctl is-active --quiet lalune-backend.service
          systemctl is-active --quiet lalune-gateway.service
          echo BACKEND_INSTALLER_CLEAN_INSTALL_REINSTALL_FOREIGN_COLLISION_GATEWAY_PRESERVATION_PASS
          BACKEND_INSTALL_TEST

      - name: Validate VK call hash with the pinned real ARM64 client
        env:
          VK_CALL_HASH: ${{ secrets.VK_CALL_HACH_1 }}
        run: |
          set -euo pipefail
          test -n "${VK_CALL_HASH:-}" || { echo "VK_CALL_HACH_1 repository secret is missing" >&2; exit 1; }
          SSH=(ssh -i vm/id_ed25519 -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null tester@127.0.0.1)
          SCP=(scp -i vm/id_ed25519 -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          "${SCP[@]}" vm/real/client-linux-arm64 tester@127.0.0.1:/home/tester/client-linux-arm64
          printf '%s' "$VK_CALL_HASH" | "${SSH[@]}" 'umask 077; cat > /home/tester/.vk-call-hash'
          unset VK_CALL_HASH
          "${SSH[@]}" 'set -euo pipefail
            trap "rm -f /home/tester/.vk-call-hash" EXIT
            chmod 0755 /home/tester/client-linux-arm64
            HASH="$(cat /home/tester/.vk-call-hash)"
            test -n "$HASH"
            set +e
            /home/tester/client-linux-arm64 --vk "$HASH" --validate-vk-hashes > /tmp/vk-hash-validation.jsonl 2>/tmp/vk-hash-validation.stderr
            rc=$?
            set -e
            python3 - <<"PY"
          import json
          from pathlib import Path
          rows = []
          for line in Path("/tmp/vk-hash-validation.jsonl").read_text(errors="replace").splitlines():
              if line.startswith("HASH_CHECK:"):
                  try:
                      rows.append(json.loads(line[len("HASH_CHECK:"):]))
                  except Exception:
                      pass
          if not rows:
              print("VK_HASH_VALIDATION_NO_RESULT")
              raise SystemExit(1)
          statuses = [str(row.get("status", "unknown")) for row in rows]
          print("VK_HASH_VALIDATION_STATUSES", ",".join(statuses))
          for row in rows:
              message = str(row.get("message", "")).replace(str(row.get("hash", "")), "[REDACTED]")
              if message:
                  print("VK_HASH_VALIDATION_DETAIL", message[:500])
          if not any(row.get("status") == "valid" for row in rows):
              raise SystemExit(1)
          PY
            test "$rc" -eq 0
            echo REAL_ARM64_CLIENT_VK_HASH_VALIDATION_PASS
          '

      - name: Test generated-shape Direct IPv4 and IPv6 policy with real nftables and Linux routes
        run: |
          set -euo pipefail
          ssh -i vm/id_ed25519 -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null tester@127.0.0.1 'sudo bash -se' <<'DIRECT_TEST'
          set -euo pipefail
          cloud-init status --wait || true
          command -v nft >/dev/null
          command -v dnsmasq >/dev/null
          cleanup() {
            ip rule del pref 22010 fwmark 0x4d53/0xffff lookup main 2>/dev/null || true
            ip -6 rule del pref 22010 fwmark 0x4d53/0xffff lookup main 2>/dev/null || true
            ip rule del pref 22020 from 192.168.5.0/24 lookup 202 2>/dev/null || true
            ip -6 rule del pref 22020 from fd00:5::/64 lookup 202 2>/dev/null || true
