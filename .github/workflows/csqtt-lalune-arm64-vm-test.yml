            sudo ip -4 route show table main > /tmp/main-routes.before
            sudo ip -4 route show table 42424 > /tmp/foreign-routes.before
            sudo ip -4 rule show > /tmp/ip-rules.before
            sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\\[[0-9:]*\\]/[COUNTERS]/g" > /tmp/iptables.before
            grep -Fq "blackhole 198.18.77.0/24" /tmp/foreign-routes.before
            grep -Eq "^42424:.*to 198\\.18\\.77\\.0/24.*lookup 42424$" /tmp/ip-rules.before
            grep -Fq 'FOREIGN_TEST_RULE_KEEP' /tmp/iptables.before
            sudo ip -4 route show table 470010 > /tmp/near-miss-routes.before
            sudo ip -4 rule show > /tmp/all-ip-rules.before
            grep -Fq "blackhole 198.18.78.0/24" /tmp/near-miss-routes.before
            grep -Eq "^470010:.*to 198\\.18\\.78\\.0/24.*lookup 470010$" /tmp/all-ip-rules.before
            grep -Eq "^470011:.*fwmark 0x67410/0xffff lookup 470010$" /tmp/all-ip-rules.before
            grep -Fq 'CSQTT_LALUNE-FOREIGN_RULE_KEEP' /tmp/iptables.before
            grep -Fq 'CSQTT_LALUNEISH_FOREIGN_KEEP' /tmp/iptables.before
            cat <<'SECRETS' | sudo tee /opt/lalune-package/server-secrets.txt >/dev/null
            wire-password
            wire-user
            wire-web-password
            wire-device
            SECRETS
            sudo chmod 0600 /opt/lalune-package/server-secrets.txt
            sudo env CSQTT_LALUNE_UDP_PORT=47000 CSQTT_LALUNE_WEB_PORT=47002 bash /opt/lalune-package/install-csqtt-lalune.sh --secrets-file /opt/lalune-package/server-secrets.txt
            sudo systemctl is-active --quiet csqtt-lalune.service
            sudo grep -Fq 'CSQTT_DEVICE_ID=01234567-89ab-cdef-0123-456789abcdef' /etc/csqtt-lalune/server.env
            sudo systemctl is-active --quiet csqtt.service
            sudo systemctl is-active --quiet csqtt-47000.service
            sudo systemctl is-active --quiet csqtt-47000-netns.service
            sudo systemctl show -p ActiveState -p SubState csqtt.service csqtt-47000.service csqtt-47000-netns.service > /tmp/production-states.after-install
            diff -u /tmp/production-states.before /tmp/production-states.after-install
            sudo ip -4 route show table 42424 > /tmp/foreign-routes.after-install
            diff -u /tmp/foreign-routes.before /tmp/foreign-routes.after-install
            sudo ip -4 route show table 470010 > /tmp/near-miss-routes.after-install
            diff -u /tmp/near-miss-routes.before /tmp/near-miss-routes.after-install
            sudo ip -4 rule show > /tmp/all-ip-rules.after-install
            while IFS= read -r rule; do grep -Fqx -- "$rule" /tmp/all-ip-rules.after-install; done < /tmp/all-ip-rules.before
            sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\\[[0-9:]*\\]/[COUNTERS]/g" > /tmp/iptables.after-install
            grep -Fq 'CSQTT_LALUNE-FOREIGN_RULE_KEEP' /tmp/iptables.after-install
            grep -Fq 'CSQTT_LALUNEISH_FOREIGN_KEEP' /tmp/iptables.after-install
            # The packaged service must bind only its dedicated ports.
            for attempt in $(seq 1 20); do
              if sudo ss -H -lun 'sport = :47000' | grep -q . && sudo ss -H -ltn 'sport = :47002' | grep -q .; then break; fi
              sleep 1
            done
            sudo ss -H -lun 'sport = :47000' | grep -q .
            sudo ss -H -ltn 'sport = :47002' | grep -q .
            # Credentials are supplied by the protected EnvironmentFile generated by the installer.
            # Keep the real installer-generated systemd unit, without a CI-only ExecStart override.

            for attempt in $(seq 1 20); do
              if sudo ss -H -lun 'sport = :47000' | grep -q . && sudo ss -H -ltn 'sport = :47002' | grep -q .; then break; fi
              sleep 1
            done
            sudo journalctl -u csqtt-lalune.service --no-pager > /tmp/csqtt-lalune-before-probe.log
            # First independent probe process completed an authenticated server exchange
            # and bidirectional TUN packet test. Now force a server process restart and
            # launch a fresh OS process with a fresh UDP socket to verify recovery.
            python3 /home/tester/csqtt-vm-probe.py
            sudo systemctl is-active --quiet csqtt-lalune.service
            sudo journalctl -u csqtt-lalune.service --no-pager > /tmp/csqtt-lalune-after-probe.log
            sudo systemctl is-active --quiet csqtt-lalune.service
            sleep 1
            sudo systemctl is-active --quiet csqtt-lalune.service
            sudo journalctl -u csqtt-lalune.service --no-pager > /tmp/csqtt-lalune-after-probe.log
            diff -u /tmp/csqtt-lalune-before-probe.log /tmp/csqtt-lalune-after-probe.log > /tmp/csqtt-lalune-probe-diff.log || true

            # Same-process recovery check: keep one Python client process and one UDP
            # socket alive while restarting only the disposable server. Authenticate
            # and decrypt TUNCONF both before and after restart. This tests protocol
            # re-establishment in a persistent client process, not the Go app supervisor.
            python3 /home/tester/csqtt-same-process-recovery.py | tee /tmp/csqtt-same-process-recovery.log
            grep -q '^SAME_PROCESS_TUNCONF before_restart ' /tmp/csqtt-same-process-recovery.log
            grep -q '^SAME_PROCESS_TUNCONF after_restart ' /tmp/csqtt-same-process-recovery.log
            grep -q '^CSQTT_SAME_PROCESS_PROTOCOL_RECOVERY_PASS ' /tmp/csqtt-same-process-recovery.log
            # Re-run the existing authenticated bidirectional IPv4/TUN dataplane
            # probe after the restart. This is deliberately a fresh probe process:
            # it proves dataplane service is restored, while the preceding test
            # separately proves same-process protocol recovery. It does NOT claim
            # same-process dataplane continuity for the real Go/Rust client.
            python3 /home/tester/csqtt-vm-probe.py | tee /tmp/csqtt-vm-probe-after-restart.log
            grep -q '^LIVE_TUN_BIDIRECTIONAL_IPV4_PASS ' /tmp/csqtt-vm-probe-after-restart.log
            sudo systemctl is-active --quiet csqtt-lalune.service
            # Installing the isolated service must not change the main/default route table.
            sudo ip -4 route show table main > /tmp/main-routes.after-install
            # The dedicated TUN subnet route is expected while the isolated service is running.
            grep -Fq "10.67.68.0/24 dev csqtt-lalune0" /tmp/main-routes.after-install
            grep -vF "10.67.68.0/24 dev csqtt-lalune0" /tmp/main-routes.after-install > /tmp/main-routes.unrelated-after-install
            sudo diff -u /tmp/main-routes.before /tmp/main-routes.unrelated-after-install
            # Every pre-existing policy rule and firewall rule must survive installation.
            sudo ip -4 rule show > /tmp/ip-rules.after-install
            sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\\[[0-9:]*\\]/[COUNTERS]/g" > /tmp/iptables.after-install
            while IFS= read -r rule; do grep -Fqx -- "$rule" /tmp/ip-rules.after-install; done < /tmp/ip-rules.before
            while IFS= read -r rule; do grep -Fqx -- "$rule" /tmp/iptables.after-install; done < /tmp/iptables.before
            sudo sha256sum -c /tmp/production-units.before
            sudo /opt/lalune-package/uninstall-csqtt-lalune.sh
            ! sudo systemctl is-active --quiet csqtt-lalune.service
            sudo systemctl is-active --quiet csqtt.service
            sudo systemctl is-active --quiet csqtt-47000.service
            sudo systemctl is-active --quiet csqtt-47000-netns.service
            sudo sha256sum -c /tmp/production-units.before
            sudo systemctl show -p ActiveState -p SubState csqtt.service csqtt-47000.service csqtt-47000-netns.service > /tmp/production-states.after-uninstall
            diff -u /tmp/production-states.before /tmp/production-states.after-uninstall
            sudo ip -4 route show table 42424 > /tmp/foreign-routes.after-uninstall
            diff -u /tmp/foreign-routes.before /tmp/foreign-routes.after-uninstall
            sudo ip -4 route show table 470010 > /tmp/near-miss-routes.after-uninstall
            diff -u /tmp/near-miss-routes.before /tmp/near-miss-routes.after-uninstall
            sudo ip -4 rule show > /tmp/all-ip-rules.after-uninstall
            while IFS= read -r rule; do grep -Fqx -- "$rule" /tmp/all-ip-rules.after-uninstall; done < /tmp/all-ip-rules.before
            sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\\[[0-9:]*\\]/[COUNTERS]/g" > /tmp/iptables.after-uninstall
            grep -Fq 'CSQTT_LALUNE-FOREIGN_RULE_KEEP' /tmp/iptables.after-uninstall
            grep -Fq 'CSQTT_LALUNEISH_FOREIGN_KEEP' /tmp/iptables.after-uninstall
            sudo ip -4 route show table main > /tmp/main-routes.after-uninstall
            sudo diff -u /tmp/main-routes.before /tmp/main-routes.after-uninstall
            sudo ip -4 rule show > /tmp/ip-rules.after-uninstall
            sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\\[[0-9:]*\\]/[COUNTERS]/g" > /tmp/iptables.after-uninstall
            while IFS= read -r rule; do grep -Fqx -- "$rule" /tmp/ip-rules.after-uninstall; done < /tmp/ip-rules.before
            while IFS= read -r rule; do grep -Fqx -- "$rule" /tmp/iptables.after-uninstall; done < /tmp/iptables.before
            sudo test -f /etc/csqtt-lalune/.managed-by-lalune
            sudo grep -Fxq CSQTT-LALUNE-MANAGED-V1 /etc/csqtt-lalune/.managed-by-lalune
            echo ARM64_SYSTEM_VM_LIFECYCLE_PASS'
          
      - name: End-to-end test of the actual Deploy button API against disposable ARM64 VM
