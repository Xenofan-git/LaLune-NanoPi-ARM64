              "Authorization": "Basic " + base64.b64encode(b"admin:ci-panel-password-for-isolated-vm").decode(),
              "Origin": "http://127.0.0.1:1062",
          },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise SystemExit("Deploy button API refused the isolated uninstall request")
          print("DEPLOY_BUTTON_UNINSTALL_API_ACCEPTED")
          PY
          uninstall_done=0
          for attempt in $(seq 1 450); do
            status="$(curl -fsS -u admin:ci-panel-password-for-isolated-vm http://127.0.0.1:1062/deploy/status)"
            if python3 -c 'import json,sys; raise SystemExit(0 if not json.load(sys.stdin).get("deploying", True) else 1)' <<<"$status"; then
              uninstall_done=1
              break
            fi
            sleep 2
          done
          [[ "$uninstall_done" == 1 ]] || { cat vm/deploy-e2e-backend.log; exit 1; }
          uninstall_log="$(curl -fsS -u admin:ci-panel-password-for-isolated-vm http://127.0.0.1:1062/deploy/log | python3 -c 'import json,sys; print(json.load(sys.stdin))')"
          printf '%s\n' "$uninstall_log"
          grep -Fq 'CSQTT_LALUNE_UNINSTALL_OK' <<<"$uninstall_log"
          ssh -i vm/id_ed25519 -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null tester@127.0.0.1 'sudo systemctl is-active --quiet csqtt.service && sudo systemctl is-active --quiet csqtt-47000.service && sudo systemctl is-active --quiet csqtt-47000-netns.service && ! sudo systemctl is-active --quiet csqtt-lalune.service && sudo ip -4 route show table main > /tmp/main-routes.after-button-uninstall && diff -u /tmp/main-routes.before /tmp/main-routes.after-button-uninstall && sudo ip -4 rule show > /tmp/ip-rules.after-button-uninstall && diff -u /tmp/ip-rules.before /tmp/ip-rules.after-button-uninstall && sudo iptables-save | sed "/^# Generated by iptables-save/d; /^# Completed on /d; s/\\[[0-9:]*\\]/[COUNTERS]/g" | python3 -c "import re,sys; s=sys.stdin.read(); s=re.sub(r\"(?ms)^\\*(?:mangle|nat)\\n(?:(?::[A-Z0-9_-]+ ACCEPT \\[COUNTERS\\])\\n)+COMMIT\\n\", \"\", s); sys.stdout.write(s)" > /tmp/iptables.after-button-uninstall && diff -u /tmp/iptables.before /tmp/iptables.after-button-uninstall && sudo ip -4 route show table 470010 > /tmp/near-miss-routes.after-button-uninstall && diff -u /tmp/near-miss-routes.before /tmp/near-miss-routes.after-button-uninstall && sudo test -s /etc/csqtt-lalune/csqtt.db && sudo test -f /etc/csqtt-lalune/csqtt.env && sudo ss -H -ltn "sport = :80" | grep -q . && sudo kill "$(sudo cat /run/lalune-test-port80.pid)"'
          ip -4 route show table main > vm/runner-main-routes.after
          ip -4 rule show > vm/runner-ip-rules.after
          diff -u vm/runner-main-routes.before vm/runner-main-routes.after
