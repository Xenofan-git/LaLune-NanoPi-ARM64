name: Build original LaLune Linux ARM64

on:
  push:
    branches:
      - original-lalune-linux-arm64-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout adaptation repository
        uses: actions/checkout@v4

      - name: Install ARM64 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          rustup target add aarch64-unknown-linux-gnu

      - name: Clone upstream LaLune
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Endlad2/LaLune.git upstream-lalune

      - name: Apply NanoPi ARM64 and isolated policy routing
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          core = Path("upstream-lalune/Backend/Desktop/src/core_manager.rs")
          text = core.read_text()
          marker = '"client-linux-x86_64"'
          if marker not in text:
              raise SystemExit("core asset marker not found")
          core.write_text(text.replace(marker, '"client-linux-arm64"', 1))

          vpn = Path("upstream-lalune/Backend/Desktop/src/vpn.rs")
          text = vpn.read_text()

          dns_marker = 'pub const DEFAULT_DNS: &str = "8.8.8.8,8.8.4.4";'
          constants = """pub const POLICY_TABLE: u32 = 202;
pub const POLICY_PREF: u32 = 22020;
pub const CLIENT_SUBNET: &str = "192.168.5.0/24";"""
          if dns_marker not in text:
              raise SystemExit("vpn constants marker not found")
          text = text.replace(dns_marker, dns_marker + "\n" + constants, 1)

          route_old = """    run_sudo(
        &format!("ip route add default dev {}", TUN_NAME),
        events,
    );"""
          route_new = """    // Keep NanoPi main routing untouched.
    // Only downstream clients on eth1 use LaLune table 202.
    run_sudo(
        &format!("ip rule del pref {} 2>/dev/null || true", POLICY_PREF),
        events,
    );
    run_sudo(
        &format!("ip route flush table {} 2>/dev/null || true", POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip route replace 192.168.4.0/24 dev eth0 table {}", POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip route replace {} dev eth1 table {}", CLIENT_SUBNET, POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip route replace default dev {} table {}", TUN_NAME, POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip rule add pref {} from {} lookup {}", POLICY_PREF, CLIENT_SUBNET, POLICY_TABLE),
        events,
    );"""
          if route_old not in text:
              raise SystemExit("Linux default-route block not found")
          text = text.replace(route_old, route_new, 1)

          cleanup_old = """    run_sudo(
        &format!("ip route del default dev {} 2>/dev/null || true", TUN_NAME),
        events,
    );"""
          cleanup_new = """    run_sudo(
        &format!(
            "ip rule del pref {} 2>/dev/null || true; ip route flush table {} 2>/dev/null || true",
            POLICY_PREF, POLICY_TABLE
        ),
        events,
    );"""
          if cleanup_old not in text:
              raise SystemExit("Linux cleanup block not found")
          vpn.write_text(text.replace(cleanup_old, cleanup_new, 1))
          PY

      - name: Show applied routing patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -nE 'POLICY_TABLE|POLICY_PREF|CLIENT_SUBNET|ip rule|ip route' upstream-lalune/Backend/Desktop/src/vpn.rs

      - name: Build ARM64
        working-directory: upstream-lalune/Backend/Desktop
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
        run: |
          set -euxo pipefail
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail
          file upstream-lalune/Backend/Desktop/target/aarch64-unknown-linux-gnu/release/lalune-backend
          aarch64-linux-gnu-readelf -h upstream-lalune/Backend/Desktop/target/aarch64-unknown-linux-gnu/release/lalune-backend | grep -E 'Class:|Machine:'

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist
          cp upstream-lalune/Backend/Desktop/target/aarch64-unknown-linux-gnu/release/lalune-backend dist/lalune-backend-linux-arm64
          chmod +x dist/lalune-backend-linux-arm64
          sha256sum dist/lalune-backend-linux-arm64 | tee dist/SHA256SUMS
          tar -C dist -czf lalune-original-linux-arm64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lalune-original-linux-arm64
          path: lalune-original-linux-arm64.tar.gz
          if-no-files-found: error
