name: Build pinned original LaLune Linux ARM64
# CI trigger verification: test/csqtt-client-reconnect-vm
# pinned-reference: Endlad2/LaLune @ e4a6d08

on:
  push:
    branches:
      - original-lalune-linux-arm64-policy
      - integration/deploymanager-fix
      - fix/captcha-stale-overlay
      - feature/csqtt-direct-route-tab
      - test/csqtt-client-reconnect-vm
      - test/csqtt-process-recovery-e2e
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build pinned original Go Linux ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate adaptation
        run: |
          set -euxo pipefail
          test -f adapt/apply-pinned-original-linux-arm64-policy.py
          # Client TUN must never flush a shared route table or mutate global resolver state.
          ! grep -Fq 'ip route flush table 202' adapt/apply-pinned-original-linux-arm64-policy.py
          ! grep -Fq '>> /etc/resolv.conf' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'ip -o route show table 202' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'ip -o rule show pref 22020' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'ip route add default dev csqtt0 table 202' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'ip route del default dev csqtt0 table 202' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'resolvectl dns csqtt0' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'func (t *LinuxTun) SetupRoutes(tunIP, tunDNS string) error' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'if err := tun.SetupRoutes(tunIP, tunDNS); err != nil {' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'return fmt.Errorf("configure csqtt0 DNS: %w", err)' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'rollback()' adapt/apply-pinned-original-linux-arm64-policy.py
      - name: Validate CAPTCHA Bridge source
        run: |
          set -euxo pipefail
          test -s captcha-bridge/manifest.json
          test -s captcha-bridge/captcha-bridge.js
          test -s captcha-bridge/README.md
          python3 -m json.tool captcha-bridge/manifest.json >/dev/null
          node --check captcha-bridge/captcha-bridge.js
      - name: Validate CSQTT panel route UI
        run: |
          set -euxo pipefail
          test -f adapt/csqtt-panel-preview.html
          grep -q 'id="page-route"' adapt/csqtt-panel-preview.html
          grep -q 'id="directDomains"' adapt/csqtt-panel-preview.html
          grep -q 'id="directIPs"' adapt/csqtt-panel-preview.html
          grep -q 'id="saveDirectRules"' adapt/csqtt-panel-preview.html
          test "$(grep -o 'data-page="' adapt/csqtt-panel-preview.html | wc -l)" -eq 6
          grep -q 'function directRuleErrors()' adapt/csqtt-panel-preview.html
          grep -Fq 'func (t *LinuxTun) ApplyDirectRouting() error' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -q 't.applyDirectRoutingLocked()' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -q 't.cleanupDirectRoutingLocked()' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -q 'func TestDirectDomainValidation' adapt/headless_main_test.go
          grep -q 'func TestNormalizeDirectIPs' adapt/headless_main_test.go
          grep -Fq 'func TestDirectPlanTransitions' adapt/headless_main_test.go
          grep -Fq 'func prepareDirectPlan(domainsRaw, ipsRaw string)' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'func writeDirectFileAtomic(path string, data []byte, mode os.FileMode) error' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'writeDirectFileAtomic(directDnsmasqMain' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'strings.Split(string(data),' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'strings.Join(out,' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'validDirectDomain(s string) bool' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'if err := t.applyDirectRoutingLocked(); err != nil' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 't.cleanupDirectRoutingLocked()' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'dnsmasqChanged = true' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'writeDirectFileAtomic(directNftPath' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'writeDirectFileAtomic(directDnsmasqPath' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq 'nft -c -f ' adapt/apply-pinned-original-linux-arm64-policy.py
          grep -Fq '"core": "csqtt-server/2.1.9"' adapt/headless_main.go
          grep -Fq 'func TestVersionEndpointReportsBuildProvenance' adapt/headless_main_test.go
          grep -Fq '"commit": buildCommit' adapt/headless_main.go
          grep -Fq '"buildRun": buildRunID' adapt/headless_main.go
          grep -Fq '"buildDate": buildDate' adapt/headless_main.go
          grep -Fq '"buildBranch": buildBranch' adapt/headless_main.go
          grep -Fq '"upstreamCommit": buildUpstreamCommit' adapt/headless_main.go
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("adapt/csqtt-panel-preview.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert scripts, "no inline panel script found"
          Path("/tmp/csqtt-panel.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/csqtt-panel.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("adapt/csqtt-panel-preview.html").read_text()
          ids = set(re.findall(r'\bid="([^"]+)"', html))
          js = Path("/tmp/csqtt-panel.js").read_text()
          refs = set(re.findall(r"\$\('([^']+)'\)", js))
          missing = sorted(refs - ids)
          if missing:
              raise SystemExit("panel JS references missing DOM ids: " + ", ".join(missing))
          PY
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          architecture: x64
          cache: true
      - name: Install ARM64 toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Set up Rust ARM64 target
        run: |
          set -euxo pipefail
          rustup target add aarch64-unknown-linux-gnu
      - name: Clone pinned original LaLune
        run: |
          set -euxo pipefail
          git clone https://github.com/Endlad2/LaLune.git upstream-lalune
          cd upstream-lalune
          git checkout --detach e4a6d08b63aef6025bf8ad8f77da660ea552e04b
          test "$(git rev-parse HEAD)" = "e4a6d08b63aef6025bf8ad8f77da660ea552e04b"
      - name: Apply NanoPi adaptation to pinned source
        run: |
          set -euxo pipefail
          python3 adapt/apply-pinned-original-linux-arm64-policy.py
          python3 adapt/patch-csqtt-deploy-ui.py
      - name: Build original Flutter Web panel for NanoPi
        working-directory: upstream-lalune/Frontend/Core
        run: |
          set -euxo pipefail
          cp ../../../adapt/nanopi.js web/api.js
          flutter pub get
          flutter build web --release
      - name: Verify provenance and exact adaptation
        run: |
          set -euxo pipefail
          test "$(git -C upstream-lalune rev-parse HEAD)" = "e4a6d08b63aef6025bf8ad8f77da660ea552e04b"
          grep -Fq 'return "client-linux-arm64"' upstream-lalune/Desktop/Libs/protocols.go
          grep -Fq '"--ssh-port", itoa(req.SSHPort)' upstream-lalune/Desktop/Libs/deploy.go
          # Verify the isolated policy-routing implementation, not an obsolete literal command.
          grep -Fq 'ip -o route show table 202' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'ip -o rule show pref 22020' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'ip route add default dev csqtt0 table 202' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'ip route del default dev csqtt0 table 202' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'resolvectl dns csqtt0' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'bridge.StartTunnel(coreListenPort)' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'func (r *LinuxRunner) StartCore' upstream-lalune/Desktop/Linux/app_linux.go
          # Auto VK must never put access tokens in argv; sudo auth uses a separate stdin exchange.
          ! grep -Fq 'cmd = append(cmd, "--token", token)' upstream-lalune/Desktop/Libs/bridge.go
          grep -Fq 'VK_JS_BOOTSTRAP:' upstream-lalune/Desktop/Libs/bridge.go
          grep -Fq 'sudo", "-S", "-v' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'sudo", "-n", "sh", "-c", cmdLine' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'linuxRunnerInputs.Store(r, stdin)' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'LoadAndDelete(r)' upstream-lalune/Desktop/Linux/app_linux.go

          test "$(grep -Fc 'bridge.StartTunnel(coreListenPort)' upstream-lalune/Desktop/Linux/app_linux.go)" = "1"
          test "$(grep -Fc 'func (r *LinuxRunner) StartCore' upstream-lalune/Desktop/Linux/app_linux.go)" = "1"
          sha256sum upstream-lalune/Desktop/Linux/app_linux.go | tee adaptation-source.sha256
          sha256sum upstream-lalune/Desktop/Libs/protocols.go | tee protocols-source.sha256
      - name: Patch CSQTT DeployManager safely
        run: |
          set -euxo pipefail
          python3 adapt/patch-csqtt-deploy-manager.py

      - name: Verify CSQTT DeployManager uses original deployment flow
        run: |
          set -euxo pipefail
          grep -Fq 'deploy-csqtt-lalune.sh' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'csqtt-lalune-linux-arm64' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'csqtt-lalune-linux-amd64' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'CSQTT_LALUNE_DEPLOY_OK' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'CSQTT_LALUNE_UNINSTALL_OK' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'CSQTT_DEPLOY_STAGE' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'SSH_ASKPASS_REQUIRE' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'deploy_official_csqtt(args, ports)' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'bash "$BUNDLE/deploy-csqtt-lalune.sh" install' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'bash "$BUNDLE/deploy-csqtt-lalune.sh" uninstall' upstream-lalune/Core/DeployManager/src/deploy.rs
          ! grep -Fq 'install-csqtt-lalune.sh' upstream-lalune/Core/DeployManager/src/deploy.rs
          ! grep -Fq 'CSQTT_LALUNE_UDP_PORT' upstream-lalune/Core/DeployManager/src/deploy.rs
          ! grep -Fq 'CSQTT_ISOLATION_REQUIRED' upstream-lalune/Core/DeployManager/src/deploy.rs
          ! grep -Fq 'bash /tmp/deploy.sh uninstall' upstream-lalune/Core/DeployManager/src/deploy.rs
          grep -Fq 'pub secrets_file: Option<String>' upstream-lalune/Core/DeployManager/src/main.rs
          grep -Fq 'pub local_binary_dir: Option<String>' upstream-lalune/Core/DeployManager/src/main.rs
          grep -Fq 'pub uninstall: bool' upstream-lalune/Core/DeployManager/src/main.rs
          grep -Fq 'func validCSQTTSecret' upstream-lalune/Desktop/Libs/deploy.go
          grep -Fq 'DeviceID string `json:"deviceId"`' upstream-lalune/Desktop/Libs/deploy.go
          grep -Fq 'validCSQTTDeviceID(req.DeviceID)' upstream-lalune/Desktop/Libs/deploy.go
          grep -Fq "'deviceId': deviceId" upstream-lalune/Frontend/Core/lib/pages/deploy_page.dart
          grep -Fq 'Api.getDeviceId()' upstream-lalune/Frontend/Core/lib/pages/deploy_page.dart
          grep -Fq "'mainPassword': _mainPassword.text" upstream-lalune/Frontend/Core/lib/pages/deploy_page.dart
          grep -Fq 'VKTokenFetcherARM64Archive' upstream-lalune/Desktop/Libs/vktoken.go
          grep -Fq 'ResolveChromiumExecutable' upstream-lalune/Core/LaLuneTokenFetcher/Playwright/PlaywrightTokenFetcher.cs
          grep -Fq 'SaveVKTokenInput' upstream-lalune/Desktop/Libs/vktoken.go
          grep -Fq 'mux.HandleFunc("/vk/import"' adapt/headless_main.go
          grep -Fq 'id="vkImportPanel"' adapt/csqtt-panel-preview.html
          grep -Fq 'csqtt-deploy-secrets-*.txt' upstream-lalune/Desktop/Libs/deploy.go

      - name: Prepare original Go module layout
        run: |
          set -euxo pipefail
          test -f upstream-lalune/Desktop/Linux/go.mod
          test -f upstream-lalune/Desktop/Linux/go.sum
          ln -s ../Libs upstream-lalune/Desktop/Linux/Libs
          cp upstream-lalune/Desktop/Windows/go.mod upstream-lalune/Desktop/Linux/go.mod
          cp upstream-lalune/Desktop/Windows/go.sum upstream-lalune/Desktop/Linux/go.sum
          cp upstream-lalune/Core/SmartTunnel.lua upstream-lalune/Desktop/Libs/SmartTunnel.lua
          mv upstream-lalune/Desktop/Linux/app.go upstream-lalune/Desktop/Linux/app_gui.go.disabled
          cp adapt/headless_main.go upstream-lalune/Desktop/Linux/headless_main.go
          cp adapt/headless_main_test.go upstream-lalune/Desktop/Linux/headless_main_test.go
          cp adapt/linux_tun_vm_test.go upstream-lalune/Desktop/Linux/linux_tun_vm_test.go
          mkdir -p upstream-lalune/Desktop/Linux/frontend
          cp -a upstream-lalune/Frontend/Core/build/web/. upstream-lalune/Desktop/Linux/frontend/
          # The binary's embedded fallback UI uses the CSQTT-style panel preview.
          # The normal Nginx document root is not replaced by this build step.
          cp adapt/csqtt-panel-preview.html upstream-lalune/Desktop/Linux/frontend/index.html
          test -s upstream-lalune/Desktop/Linux/frontend/index.html
          grep -Fq 'CSQTT · NanoPi' upstream-lalune/Desktop/Linux/frontend/index.html
          test -s upstream-lalune/Desktop/Linux/frontend/api.js
          grep -Fq 'go:embed frontend' upstream-lalune/Desktop/Linux/headless_main.go
          grep -Fq 'const headlessListen = "127.0.0.1:1062"' upstream-lalune/Desktop/Linux/headless_main.go
          grep -Fq 'mux.HandleFunc("/vpn/connect"' upstream-lalune/Desktop/Linux/headless_main.go
          grep -Fq 'mux.HandleFunc("/configs"' upstream-lalune/Desktop/Linux/headless_main.go
      - name: Build ARM64 DeployManager
        working-directory: upstream-lalune/Core/DeployManager
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euxo pipefail
          cargo build --release --target aarch64-unknown-linux-gnu
          file target/aarch64-unknown-linux-gnu/release/deploy-manager
          test -s target/aarch64-unknown-linux-gnu/release/deploy-manager

      - name: Build host-native DeployManager for API deployment E2E
        working-directory: upstream-lalune/Core/DeployManager
        run: |
          set -euxo pipefail
          cargo build --release
          install -m 0755 target/release/deploy-manager /tmp/deploy-manager-linux-amd64-e2e
          file /tmp/deploy-manager-linux-amd64-e2e | grep -Eq 'x86-64|x86_64'
      - name: Download Go modules
        working-directory: upstream-lalune/Desktop/Linux
        run: |
          set -euxo pipefail
          go mod download
      - name: Test deploy access policy and CAPTCHA lifecycle
        working-directory: upstream-lalune/Desktop/Linux
        run: |
          set -euxo pipefail
          go test -count=1 .
          # Compile the exact generated client TUN tests for execution inside the ARM64 guest.
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o "$GITHUB_WORKSPACE/client-tun-tests-arm64" .
          file "$GITHUB_WORKSPACE/client-tun-tests-arm64"
          test -s "$GITHUB_WORKSPACE/client-tun-tests-arm64"

      - name: Build ARM64
        working-directory: upstream-lalune/Desktop/Linux
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euxo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags="-s -w -X main.buildCommit=${GITHUB_SHA} -X main.buildRunID=${GITHUB_RUN_ID} -X main.buildRunNumber=${GITHUB_RUN_NUMBER} -X main.buildDate=${BUILD_DATE} -X main.buildBranch=${GITHUB_REF_NAME} -X main.buildUpstreamCommit=e4a6d08b63aef6025bf8ad8f77da660ea552e04b" -o lalune-original-linux-arm64 .
          file lalune-original-linux-arm64
          test -s lalune-original-linux-arm64
      - name: Build host-native backend for API deployment E2E
        working-directory: upstream-lalune/Desktop/Linux
        run: |
          set -euxo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.buildCommit=${GITHUB_SHA} -X main.buildRunID=${GITHUB_RUN_ID} -X main.buildRunNumber=${GITHUB_RUN_NUMBER} -X main.buildDate=${BUILD_DATE} -X main.buildBranch=${GITHUB_REF_NAME} -X main.buildUpstreamCommit=e4a6d08b63aef6025bf8ad8f77da660ea552e04b" -o /tmp/lalune-original-linux-amd64-e2e .
          file /tmp/lalune-original-linux-amd64-e2e | grep -Eq 'x86-64|x86_64'
          test -s /tmp/lalune-original-linux-amd64-e2e
      - name: Set up .NET for ARM64 VK token fetcher
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch official CSQTT 2.1.9 server assets
        run: |
          set -euxo pipefail
          mkdir -p server-assets
          curl -fL --retry 3 https://github.com/amurcanov/csqtt/releases/download/v2.1.9/CSQTT-arm64-v8a.apk -o /tmp/csqtt-v2.1.9-arm64.apk
          unzip -p /tmp/csqtt-v2.1.9-arm64.apk assets/csqtt-linux-arm64 > server-assets/csqtt-linux-arm64
          unzip -p /tmp/csqtt-v2.1.9-arm64.apk assets/csqtt-linux-amd64 > server-assets/csqtt-linux-amd64
          unzip -p /tmp/csqtt-v2.1.9-arm64.apk assets/csqtt-linux-armv7 > server-assets/csqtt-linux-armv7
          unzip -p /tmp/csqtt-v2.1.9-arm64.apk assets/csqtt.server-provenance.json > server-assets/csqtt.server-provenance.json
          curl -fL --retry 3 https://raw.githubusercontent.com/amurcanov/csqtt/v2.1.9/app/src/main/assets/deploy.sh -o server-assets/deploy.sh
          python3 adapt/patch-csqtt-deploy-script.py
          chmod 0755 server-assets/csqtt-linux-arm64 server-assets/csqtt-linux-amd64 server-assets/csqtt-linux-armv7 server-assets/deploy.sh server-assets/deploy-csqtt-lalune.sh
          bash -n server-assets/deploy-csqtt-lalune.sh
          python3 adapt/test-csqtt-lalune-deploy-script.py
          # The standalone installer remains regression-tested but is not used by Deploy.
          chmod 0755 server-assets/install-csqtt-lalune.sh server-assets/uninstall-csqtt-lalune.sh
          bash -n server-assets/install-csqtt-lalune.sh
          bash -n server-assets/uninstall-csqtt-lalune.sh
          grep -Fq 'readonly SCRIPT_VERSION="2.1.9"' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'csqtt-lalune.service' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'CSQTT_LALUNE_DEPLOY_STAGE' server-assets/deploy-csqtt-lalune.sh || grep -Fq 'CSQTT_DEPLOY_STAGE' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'CSQTT_LALUNE_MANAGED' server-assets/deploy-csqtt-lalune.sh
          ! grep -Eq 'ip route flush cache|ip route flush table (main|default)|ip route replace default' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'rm -rf -- "$ETC" "$STATE" "$LOG"' server-assets/uninstall-csqtt-lalune.sh
          sha256sum server-assets/* | tee server-assets/SHA256SUMS
          grep -Fq '"version":  "2.1.9"' server-assets/csqtt.server-provenance.json
          grep -Fq '"assetName":  "csqtt-linux-arm64"' server-assets/csqtt.server-provenance.json
          grep -Fq '"assetName":  "csqtt-linux-amd64"' server-assets/csqtt.server-provenance.json
          grep -Fq '"assetName":  "csqtt-linux-armv7"' server-assets/csqtt.server-provenance.json
          grep -Fq 'readonly SCRIPT_VERSION="2.1.9"' server-assets/deploy.sh
      - name: Verify pinned upstream CSQTT ARM64 release baseline
        run: |
          set -euxo pipefail
          mkdir -p client-assets
          CLIENT_VERSION=2026.09.16.17.59
          test "$(curl -fsSL https://raw.githubusercontent.com/Endlad2/csqtt-core/main/LATEST)" = "$CLIENT_VERSION"
          curl -fL --retry 3 "https://github.com/Endlad2/csqtt-core/releases/download/$CLIENT_VERSION/client-linux-arm64" -o client-assets/client-linux-arm64-upstream
          printf '%s  %s\n' '9a5b917665fda6ee7b3cf8439e3194d46c763f2305d188b4962caee69048ae31' 'client-assets/client-linux-arm64-upstream' | sha256sum -c -
          file client-assets/client-linux-arm64-upstream
          readelf -h client-assets/client-linux-arm64-upstream | grep -Fq 'AArch64'
          echo PINNED_UPSTREAM_RUNTIME_CSQTT_CLIENT_BASELINE_PASS
      - name: Build isolated patched CSQTT client with RJS manual CAPTCHA fallback
        run: |
          set -euxo pipefail
          git clone https://github.com/Endlad2/csqtt-core.git client-source
          git -C client-source checkout --detach 3eafb7ee868f5f2690edf3b0326153813f88eb5f
          test "$(git -C client-source rev-parse HEAD)" = "3eafb7ee868f5f2690edf3b0326153813f88eb5f"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain 1.97.1
          python3 scripts/ci/patch-csqtt-rjs-manual-fallback.py
          grep -F 'RJS: ошибка, fallback на ручную CAPTCHA' client-source/rust-client/captcha.rs
          grep -F 'self.webview(stream_id, captcha, "manual", Duration::from_secs(60))' client-source/rust-client/captcha.rs
          CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo +1.97.1 build --locked --release --target aarch64-unknown-linux-gnu --manifest-path client-source/rust-client/Cargo.toml --bin client
          install -m 0755 client-source/rust-client/target/aarch64-unknown-linux-gnu/release/client client-assets/client-linux-arm64
          printf '%s\n' 'source=Endlad2/csqtt-core@3eafb7ee868f5f2690edf3b0326153813f88eb5f' 'patch=rjs-manual-captcha-fallback-v1' > client-assets/VERSION
          file client-assets/client-linux-arm64
          readelf -h client-assets/client-linux-arm64 | grep -Fq 'AArch64'
          strings -a client-assets/client-linux-arm64 | grep -Fq 'fallback'
          sha256sum client-assets/client-linux-arm64 | tee client-assets/SHA256SUMS
          echo PATCHED_RJS_MANUAL_FALLBACK_ARM64_CLIENT_BUILD_PASS
      - name: Audit whether built runtime ARM64 client contains negotiated liveness
        run: |
          set -euo pipefail
          if strings -a client-assets/client-linux-arm64 | grep -Fq 'CSQTT_LIVENESS_V1'; then
            echo "PASS: runtime ARM64 client contains CSQTT_LIVENESS_V1."
            echo "- Runtime ARM64 client binary contains the negotiated liveness protocol marker." >> "$GITHUB_STEP_SUMMARY"
            echo "CSQTT_RUNTIME_ARM64_LIVENESS_MARKER_PRESENT"
          else
            echo "NOT INCLUDED: runtime ARM64 client does not contain CSQTT_LIVENESS_V1."
            echo "- LIMITATION: runtime ARM64 client does not contain CSQTT_LIVENESS_V1; negotiated-liveness E2E patches disposable source clones only and is not included in this release binary." >> "$GITHUB_STEP_SUMMARY"
            echo "CSQTT_RUNTIME_ARM64_LIVENESS_MARKER_ABSENT"
          fi
      - name: Exercise LaLune installer lifecycle in disposable root
        run: |
          set -euxo pipefail
          chmod 0755 adapt/test-csqtt-lalune-installer.sh
          bash -n adapt/test-csqtt-lalune-installer.sh
          bash adapt/test-csqtt-lalune-installer.sh
      - name: Audit upstream CSQTT isolation hazards
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v2.1.9 https://github.com/amurcanov/csqtt.git server-source
          python3 adapt/audit-csqtt-isolation.py
      - name: Patch isolated LaLune CSQTT dataplane
        run: |
          set -euxo pipefail
          python3 adapt/patch-csqtt-lalune-source.py
          grep -Fq 'server_encrypted_tunconf_roundtrips_through_real_client_parser' server-source/rust-server/protocol.rs
          grep -Fq 'include!("../rust-client/protocol.rs");' server-source/rust-server/protocol.rs
          ! grep -R -nE 'csqtt1|10\\.66\\.67' server-source/rust-server --include='*.rs'
          grep -Fq 'csqtt-lalune0' server-source/rust-server/net_setup.rs
          grep -Fq '10.67.68.0/24' server-source/rust-server/tun_device.rs
          grep -Fq 'const TPROXY_TABLE: &str = "47001";' server-source/rust-server/proxy_route.rs
          grep -Fq 'const LEGACY_POLICY_TABLE: &str = "47066";' server-source/rust-server/proxy_route.rs
          grep -Fq 'CSQTT_SYSTEMD_UNIT' server-source/rust-server/main.rs
          ! grep -Fq '.args(["--no-block", "restart", "csqtt"])' server-source/rust-server/main.rs
          ! grep -Fq 'command.args([action, "csqtt"])' server-source/rust-server/main.rs
          grep -Fq 'CSQTT_LALUNE_TPROXY' server-source/rust-server/proxy_route.rs
          ! grep -Fq '"30001"' server-source/rust-server/proxy_route.rs
          ! grep -Fq '"1066"' server-source/rust-server/proxy_route.rs
          ! grep -Fq 'CSQTT_TPROXY' server-source/rust-server/proxy_route.rs
          ! grep -nE '46000|46001|46002' server-source/rust-server/main.rs server-source/rust-server/web_panel.rs
          grep -Fq 'default_value = "0.0.0.0:47000"' server-source/rust-server/main.rs
          grep -Fq 'default_value_t = 47002' server-source/rust-server/main.rs
          grep -Fq 'id="peer_port" value="47000"' server-source/rust-server/web_panel.rs
          grep -Fq 'id="wg_port" value="47001"' server-source/rust-server/web_panel.rs
      - name: Test pinned CSQTT client protocol suite
        working-directory: server-source/rust-client
        run: |
          set -euxo pipefail
          # Run the pinned 2.1.9 client tests on the Linux runner. This complements
          # the server-side encrypted TUNCONF/client-parser roundtrip and exercises
          # the actual client protocol, crypto, packet and TUN-adjacent modules.
          rustup toolchain install 1.97.1 --profile minimal
          # The pinned client has native TURN-core integration tests sharing
          # process-wide native state. Serialize this suite to avoid scheduler
          # races that can make the authenticated pool-deficit flow time out.
          if cargo +1.97.1 test --locked -- --test-threads=1; then
            echo PINNED_CSQTT_CLIENT_PROTOCOL_SUITE_FIRST_PASS
          else
            echo "Pinned native TURN integration timed out on first pass; rerunning the full suite once, without skipping tests."
            cargo +1.97.1 test --locked -- --test-threads=1
          fi
          echo PINNED_CSQTT_CLIENT_PROTOCOL_SUITE_PASS
      - name: Build isolated CSQTT server for Linux ARM64
        working-directory: server-source/rust-server
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain 1.97.1
          CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo +1.97.1 build --release --target aarch64-unknown-linux-gnu
          file target/aarch64-unknown-linux-gnu/release/csqtt
          test -s target/aarch64-unknown-linux-gnu/release/csqtt
          install -D -m 0755 target/aarch64-unknown-linux-gnu/release/csqtt "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-arm64"
          # Resolve every ELF dependency against the same ARM64 sysroot used by QEMU.
          aarch64-linux-gnu-readelf -h "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-arm64" | grep -Fq 'AArch64'
          aarch64-linux-gnu-readelf -l "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-arm64" | grep -Fq '/lib/ld-linux-aarch64.so.1'
          aarch64-linux-gnu-readelf -d "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-arm64" > "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-needed.txt"
          grep -Fq 'NEEDED' "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-needed.txt"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-arm64" --help > "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-help.txt"
          # Run the upstream Rust unit tests under ARM64 emulation, not only --help.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" \
            CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo +1.97.1 test --target aarch64-unknown-linux-gnu
          grep -Fq -- '--listen' "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-help.txt"
          grep -Fq -- '--web-port' "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-help.txt"
          grep -Fq -- '--config-dir' "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-help.txt"
          (cd "$GITHUB_WORKSPACE" && sha256sum server-assets/csqtt-lalune-linux-arm64 | tee -a server-assets/SHA256SUMS)
      - name: Build isolated CSQTT server for Linux x86_64
        working-directory: server-source/rust-server
        run: |
          set -euxo pipefail
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.97.1
          cargo +1.97.1 build --release --target x86_64-unknown-linux-gnu
          install -D -m 0755 target/x86_64-unknown-linux-gnu/release/csqtt "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-amd64"
          file "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-amd64" | grep -Eq 'x86-64|x86_64'
          "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-linux-amd64" --help > "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-amd64-help.txt"
          grep -Fq -- '--listen' "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-amd64-help.txt"
          grep -Fq -- '--web-port' "$GITHUB_WORKSPACE/server-assets/csqtt-lalune-amd64-help.txt"
          (cd "$GITHUB_WORKSPACE" && sha256sum server-assets/csqtt-lalune-linux-amd64 | tee -a server-assets/SHA256SUMS)
      - name: Build VK token fetcher for Linux ARM64
        run: |
          set -euxo pipefail
          dotnet publish upstream-lalune/Core/LaLuneTokenFetcher/Playwright/LaLuneTokenFetcher.Playwright.csproj -c Release -r linux-arm64 --self-contained true -o /tmp/vk-token-fetcher-arm64
          test -s /tmp/vk-token-fetcher-arm64/LaLuneTokenFetcher
          mkdir -p /tmp/vk-token-fetcher-package/vk-token-fetcher
          cp -a /tmp/vk-token-fetcher-arm64/. /tmp/vk-token-fetcher-package/vk-token-fetcher/
          chmod 0755 /tmp/vk-token-fetcher-package/vk-token-fetcher/LaLuneTokenFetcher
          (cd /tmp/vk-token-fetcher-package && zip -qr "$GITHUB_WORKSPACE/server-assets/LaLuneTokenFetcher_Linux_ARM64.zip" vk-token-fetcher)
          sha256sum server-assets/LaLuneTokenFetcher_Linux_ARM64.zip | tee -a server-assets/SHA256SUMS
          test -s server-assets/LaLuneTokenFetcher_Linux_ARM64.zip
          mkdir -p /tmp/captcha-bridge-package/captcha-bridge
          cp captcha-bridge/manifest.json captcha-bridge/captcha-bridge.js captcha-bridge/README.md /tmp/captcha-bridge-package/captcha-bridge/
          (cd /tmp/captcha-bridge-package && zip -qr "$GITHUB_WORKSPACE/server-assets/LaLune-CAPTCHA-Bridge.zip" captcha-bridge)
          sha256sum server-assets/LaLune-CAPTCHA-Bridge.zip | tee -a server-assets/SHA256SUMS
          unzip -l server-assets/LaLune-CAPTCHA-Bridge.zip | grep -Fq 'captcha-bridge/captcha-bridge.js'
          cat > server-assets/install-vk-chromium.sh <<'SH'
          #!/bin/sh
          set -eu
          if [ "$(id -u)" -ne 0 ]; then
            echo "Run as root: sudo sh install-vk-chromium.sh" >&2
            exit 1
          fi
          apt-get update
          apt-get install -y chromium
          command -v chromium
          SH
          chmod 0755 server-assets/install-vk-chromium.sh
          sha256sum server-assets/install-vk-chromium.sh | tee -a server-assets/SHA256SUMS

      - name: Verify and package
        run: |
          set -euxo pipefail
          file upstream-lalune/Desktop/Linux/lalune-original-linux-arm64
          rm -rf dist && mkdir -p dist
          install -m 0755 client-assets/client-linux-arm64 dist/client-linux-arm64
          install -m 0644 client-assets/VERSION dist/CSQTT_CLIENT_VERSION
          cp upstream-lalune/Desktop/Linux/lalune-original-linux-arm64 dist/
          install -m 0755 client-tun-tests-arm64 dist/client-tun-tests-arm64
          cp upstream-lalune/Core/DeployManager/target/aarch64-unknown-linux-gnu/release/deploy-manager dist/
          mkdir -p dist/deploy-e2e/server-assets
          install -m 0755 /tmp/lalune-original-linux-amd64-e2e dist/deploy-e2e/lalune-original-linux-amd64
          install -m 0755 /tmp/deploy-manager-linux-amd64-e2e dist/deploy-e2e/deploy-manager
          install -m 0755 server-assets/deploy-csqtt-lalune.sh dist/deploy-e2e/server-assets/deploy-csqtt-lalune.sh
          install -m 0755 server-assets/csqtt-lalune-linux-arm64 dist/deploy-e2e/server-assets/csqtt-lalune-linux-arm64
          install -m 0755 server-assets/csqtt-lalune-linux-amd64 dist/deploy-e2e/server-assets/csqtt-lalune-linux-amd64
          file dist/deploy-e2e/lalune-original-linux-amd64 | grep -Eq 'x86-64|x86_64'
          file dist/deploy-e2e/deploy-manager | grep -Eq 'x86-64|x86_64'
          cp -a server-assets dist/server-assets
          # Ship only the patched, namespaced deployment flow and server binaries.
          # Keep the raw upstream deploy.sh and generic CSQTT assets in the CI
          # workspace for provenance/tests, but never put them in the app bundle.
          rm -f dist/server-assets/deploy.sh \
            dist/server-assets/install-csqtt-lalune.sh \
            dist/server-assets/uninstall-csqtt-lalune.sh \
            dist/server-assets/csqtt-linux-arm64 \
            dist/server-assets/csqtt-linux-amd64 \
            dist/server-assets/csqtt-linux-armv7
          (cd dist/server-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cp server-assets/LaLune-CAPTCHA-Bridge.zip dist/LaLune-CAPTCHA-Bridge.zip
          cp adapt/install-original-linux-backend.sh dist/install-original-linux-backend.sh
          chmod 0755 dist/install-original-linux-backend.sh
          sh -n dist/install-original-linux-backend.sh
          cp captcha-bridge/README.md dist/CAPTCHA-BRIDGE-README.md
          test -s dist/LaLune-CAPTCHA-Bridge.zip
          test -s dist/CAPTCHA-BRIDGE-README.md
          test -x dist/install-original-linux-backend.sh
          test -s dist/server-assets/csqtt-lalune-linux-arm64
          test -s dist/server-assets/csqtt-lalune-linux-amd64
          test -s dist/server-assets/csqtt-lalune-help.txt
          test -s dist/server-assets/csqtt-lalune-amd64-help.txt
          test -x dist/server-assets/deploy-csqtt-lalune.sh
          test ! -e dist/server-assets/deploy.sh
          test ! -e dist/server-assets/install-csqtt-lalune.sh
          test ! -e dist/server-assets/uninstall-csqtt-lalune.sh
          test ! -e dist/server-assets/csqtt-linux-arm64
          bash -n dist/server-assets/deploy-csqtt-lalune.sh
          python3 adapt/test-csqtt-lalune-deploy-script.py
          (cd "$GITHUB_WORKSPACE" && sha256sum -c server-assets/SHA256SUMS)
          ! grep -Fq 'starts_with("30001:")' server-source/rust-server/proxy_route.rs
          ! grep -Fq 'fwmark 0x7531' server-source/rust-server/proxy_route.rs
          ! grep -Fq 'lookup 30001' server-source/rust-server/proxy_route.rs
          ! grep -Fq 'starts_with("1066:")' server-source/rust-server/proxy_route.rs
          ! grep -Fq 'lookup 1066' server-source/rust-server/proxy_route.rs
          ! grep -Fq 'fwmark 0x422' server-source/rust-server/proxy_route.rs
          ! grep -Fq 'route flush cache' server-source/rust-server/proxy_route.rs
          grep -Fq 'csqtt-lalune0' server-source/rust-server/net_setup.rs
          grep -Fq '10.67.68.0/24' server-source/rust-server/tun_device.rs
          ! grep -R -nE 'csqtt1|10\\.66\\.67' server-source/rust-server --include='*.rs'
          test -s dist/server-assets/LaLuneTokenFetcher_Linux_ARM64.zip
          test -s dist/server-assets/LaLune-CAPTCHA-Bridge.zip
          unzip -l dist/server-assets/LaLune-CAPTCHA-Bridge.zip | grep -Fq 'captcha-bridge/manifest.json'
          unzip -l dist/server-assets/LaLune-CAPTCHA-Bridge.zip | grep -Fq 'captcha-bridge/captcha-bridge.js'
          test -s dist/server-assets/install-vk-chromium.sh
          cp adapt/csqtt-panel-preview.html dist/csqtt-panel-preview.html
          mkdir -p dist/web-dist
          cp adapt/csqtt-panel-preview.html dist/web-dist/index.html
          cp adaptation-source.sha256 dist/
          cp protocols-source.sha256 dist/
          printf '%s\n' 'e4a6d08b63aef6025bf8ad8f77da660ea552e04b' > dist/UPSTREAM_COMMIT
          (cd dist && sha256sum lalune-original-linux-arm64 client-linux-arm64 > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar -C dist -czf lalune-original-linux-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lalune-original-linux-arm64
          path: lalune-original-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Build minimal isolated NanoPi deployment package
        run: |
          set -euxo pipefail
          rm -rf dist-csqtt-lalune
          mkdir -p dist-csqtt-lalune
          install -m 0755 server-assets/csqtt-lalune-linux-arm64 dist-csqtt-lalune/
          install -m 0755 server-assets/deploy-csqtt-lalune.sh dist-csqtt-lalune/
          cat > dist-csqtt-lalune/README.txt <<'EOF'
          CSQTT LaLune isolated ARM64 deployment package, derived from the original CSQTT v2.1.9 deployment flow.
          
          CONTENTS
          - csqtt-lalune-linux-arm64: isolated ARM64 server binary
          - deploy-csqtt-lalune.sh: namespaced original deploy.sh with the upstream install, health-check and uninstall sequence
          
          SAFETY
          - Run only on a disposable or explicitly authorized Linux ARM64 host with systemd, iproute2 and iptables.
          - Dedicated resources: csqtt-lalune.service, UDP 47000, TCP 47002, TUN csqtt-lalune0,
            subnet 10.67.68.0/24, policy tables 47001/47066, marks 0x6741/0x6742.
          - Config, binary, service, helper/timer names, firewall markers and sysctl filenames are namespaced.
          - An unrelated process already using UDP/47000 is never killed; deployment fails closed.
          - Uninstall preserves /etc/csqtt-lalune persistent database/configuration, as the original CSQTT flow does.
          
          VALIDATION STATUS
          The API-to-SSH install/uninstall E2E must pass in the disposable ARM64 system VM before production use.
          This package does not authorize deployment to NanoPi.
          EOF
          (
            cd dist-csqtt-lalune
            sha256sum csqtt-lalune-linux-arm64 deploy-csqtt-lalune.sh README.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
            test -x deploy-csqtt-lalune.sh
             test ! -e deploy.sh
             test ! -e install-csqtt-lalune.sh
             test ! -e uninstall-csqtt-lalune.sh
            ! find . -maxdepth 1 -iname '*deploy-manager*' | grep -q .
          )
          tar -C dist-csqtt-lalune -czf csqtt-lalune-nanopi-arm64-isolated.tar.gz .
          tar -tzf csqtt-lalune-nanopi-arm64-isolated.tar.gz | sort

      - uses: actions/upload-artifact@v4
        with:
          name: csqtt-lalune-nanopi-arm64-isolated
          path: csqtt-lalune-nanopi-arm64-isolated.tar.gz
          if-no-files-found: error

  arm64-system-vm:
    name: Test real CSQTT artifact in ARM64 system VM
    needs: build
    uses: ./.github/workflows/csqtt-lalune-arm64-vm-test.yml
    secrets: inherit
