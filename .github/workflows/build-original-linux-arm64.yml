name: Build original LaLune Linux ARM64

on:
  push:
    branches:
      - original-lalune-linux-arm64-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          rustup target add aarch64-unknown-linux-gnu

      - name: Clone upstream
        run: |
          set -eux
          git clone --depth 1 https://github.com/Endlad2/LaLune.git upstream-lalune

      - name: Apply NanoPi patch
        run: |
          set -eux
          python3 - <<'PY'
from pathlib import Path

core = Path("upstream-lalune/Backend/Desktop/src/core_manager.rs")
s = core.read_text()
s = s.replace('"client-linux-x86_64"', '"client-linux-arm64"', 1)
core.write_text(s)

vpn = Path("upstream-lalune/Backend/Desktop/src/vpn.rs")
s = vpn.read_text()

marker = 'pub const DEFAULT_DNS: &str = "8.8.8.8,8.8.4.4";'
constants = '''pub const POLICY_TABLE: u32 = 202;
pub const POLICY_PREF: u32 = 22020;
pub const CLIENT_SUBNET: &str = "192.168.5.0/24";'''
if marker not in s:
    raise SystemExit("vpn constants marker not found")
s = s.replace(marker, marker + "\n" + constants, 1)

old = '''    run_sudo(
        &format!("ip route add default dev {}", TUN_NAME),
        events,
    );'''
new = '''    // Keep NanoPi main routing untouched; route only eth1 clients via LaLune.
    run_sudo(
        &format!("ip rule del pref {} 2>/dev/null || true", POLICY_PREF),
        events,
    );
    run_sudo(
        &format!("ip route flush table {} 2>/dev/null || true", POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip route replace 192.168.4.0/24 dev eth0 table {}", POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip route replace {} dev eth1 table {}", CLIENT_SUBNET, POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip route replace default dev {} table {}", TUN_NAME, POLICY_TABLE),
        events,
    );
    run_sudo(
        &format!("ip rule add pref {} from {} lookup {}", POLICY_PREF, CLIENT_SUBNET, POLICY_TABLE),
        events,
    );'''
if old not in s:
    raise SystemExit("Linux route block not found")
s = s.replace(old, new, 1)

old = '''    run_sudo(
        &format!("ip route del default dev {} 2>/dev/null || true", TUN_NAME),
        events,
    );'''
new = '''    run_sudo(
        &format!(
            "ip rule del pref {} 2>/dev/null || true; ip route flush table {} 2>/dev/null || true",
            POLICY_PREF, POLICY_TABLE
        ),
        events,
    );'''
if old not in s:
    raise SystemExit("Linux cleanup block not found")
vpn.write_text(s.replace(old, new, 1))
PY

      - name: Build ARM64
        working-directory: upstream-lalune/Backend/Desktop
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          set -eux
          file upstream-lalune/Backend/Desktop/target/aarch64-unknown-linux-gnu/release/lalune-backend
          aarch64-linux-gnu-readelf -h upstream-lalune/Backend/Desktop/target/aarch64-unknown-linux-gnu/release/lalune-backend | grep -E 'Class:|Machine:'
          mkdir -p dist
          cp upstream-lalune/Backend/Desktop/target/aarch64-unknown-linux-gnu/release/lalune-backend dist/lalune-backend-linux-arm64
          chmod +x dist/lalune-backend-linux-arm64
          sha256sum dist/lalune-backend-linux-arm64 > dist/SHA256SUMS
          tar -C dist -czf lalune-original-linux-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: lalune-original-linux-arm64
          path: lalune-original-linux-arm64.tar.gz
          if-no-files-found: error
