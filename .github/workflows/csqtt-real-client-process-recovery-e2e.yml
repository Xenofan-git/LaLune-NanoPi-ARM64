name: CSQTT real client process recovery E2E (fixture work in progress)

on:
  push:
    branches:
      - test/csqtt-process-recovery-e2e

permissions:
  contents: read

jobs:
  process-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain and Linux test tools
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Fetch pinned client and server
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Endlad2/csqtt-core.git client-source
          git -C client-source checkout --detach 3eafb7ee868f5f2690edf3b0326153813f88eb5f
          git clone --depth 1 --branch v2.1.9 https://github.com/amurcanov/csqtt.git server-source
          test "$(git -C client-source rev-parse HEAD)" = "3eafb7ee868f5f2690edf3b0326153813f88eb5f"
          test "$(git -C server-source describe --tags --exact-match)" = "v2.1.9"
          cmp client-source/shared/wire_protocol.rs server-source/shared/wire_protocol.rs
          # Patch only the disposable pinned-client checkout. The normal
          # upstream VK auth path remains unchanged unless all three
          # CSQTT_TEST_TURN_* variables are explicitly supplied at runtime.
          python3 scripts/ci/patch-csqtt-process-e2e-auth.py
          grep -F 'CSQTT_TEST_TURN_USERNAME' client-source/rust-client/auth.rs

      - name: Build actual client and server executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-unknown-linux-gnu --manifest-path client-source/rust-client/Cargo.toml --bin client
          cargo build --locked --target x86_64-unknown-linux-gnu --manifest-path server-source/rust-server/Cargo.toml --bin csqtt
          test -x client-source/rust-client/target/x86_64-unknown-linux-gnu/debug/client
          test -x server-source/rust-server/target/x86_64-unknown-linux-gnu/debug/csqtt

      - name: Start and stop the actual server in an isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          server="$GITHUB_WORKSPACE/server-source/rust-server/target/x86_64-unknown-linux-gnu/debug/csqtt"
          config="$RUNNER_TEMP/csqtt-e2e-config"
          log="$RUNNER_TEMP/csqtt-server-startup.log"
          mkdir -p "$config"
          # Keep server diagnostics separate from the namespace supervisor.
          # Do not redirect the supervisor to "$log": it reads that file while
          # waiting for readiness, which otherwise makes failures opaque.
          # The timeout bounds the entire namespace lifetime.
          if sudo timeout --signal=TERM --kill-after=3s 25s unshare --net --fork --mount-proc bash -euc '
            server_log="$3"
            ip link set lo up
            "$1" --listen 127.0.0.1:46000 --web-port 0 \
              --config-dir "$2" --password ci-e2e-password \
              --device-id ci-e2e-device --web-pass ci-e2e-web-password \
              >"$server_log" 2>&1 &
            server_pid=$!
            cleanup() {
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            ready=0
            for attempt in $(seq 1 40); do
              if grep -Fq "RTP AEAD: 127.0.0.1:46000" "$server_log"; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$server_log" >&2 || true
                echo "isolated CSQTT server exited before becoming ready" >&2
                exit 1
              fi
              sleep 0.5
            done
            if [ "$ready" -ne 1 ]; then
              cat "$server_log" >&2 || true
              echo "isolated CSQTT server did not report its UDP listener" >&2
              exit 1
            fi
            grep -F "RTP AEAD: 127.0.0.1:46000" "$server_log"
            echo "PASS: real CSQTT server process started in a private network namespace."
            cleanup
            trap - EXIT
          ' _ "$server" "$config" "$log"; then
            echo "PASS: isolated server namespace exited and cleanup completed."
          else
            rc=$?
            echo "FAIL: isolated server namespace command exited with code $rc." >&2
            echo "--- CSQTT server startup log (separate from supervisor output) ---" >&2
            if [ -s "$log" ]; then cat "$log" >&2; else echo "(server log is empty)" >&2; fi
            exit "$rc"
          fi

      - name: Exercise real Rust client recovery across isolated server restart
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y coturn
          client="$GITHUB_WORKSPACE/client-source/rust-client/target/x86_64-unknown-linux-gnu/debug/client"
          server="$GITHUB_WORKSPACE/server-source/rust-server/target/x86_64-unknown-linux-gnu/debug/csqtt"
          config="$RUNNER_TEMP/csqtt-native-recovery-config"
          server_log="$RUNNER_TEMP/csqtt-native-recovery-server.log"
          client_log="$RUNNER_TEMP/csqtt-native-recovery-client.log"
          turn_log="$RUNNER_TEMP/csqtt-native-recovery-turn.log"
          mkdir -p "$config"
          : > "$server_log"
          : > "$client_log"
          : > "$turn_log"
          # All three processes live in the same disposable netns. The test-only
          # auth hook supplies fixed local TURN credentials; no VK secret/network
          # access is needed, and the fake hash is never used for real VK calls.
          sudo timeout --signal=TERM --kill-after=5s 110s unshare --net --fork --mount-proc bash -euc '
            client="$1"; server="$2"; config="$3"; server_log="$4"; client_log="$5"; turn_log="$6"
            ip link set lo up
            export CSQTT_TEST_TURN_USERNAME=ci-e2e-user
            export CSQTT_TEST_TURN_PASSWORD=ci-e2e-turn-password
            export CSQTT_TEST_TURN_SERVER=127.0.0.1
            export CSQTT_TEST_PEER_IDLE_TIMEOUT_MS=5000
            turnserver -n --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 \
              --listening-port=3478 --min-port=49160 --max-port=49200 \
              --realm=ci.test --user=ci-e2e-user:ci-e2e-turn-password \
              --allow-loopback-peers \
              --lt-cred-mech --fingerprint --no-cli --no-tls --no-dtls \
              --log-file="$turn_log" &
            turn_pid=$!
            server_pid=
            client_pid=
            cleanup() {
              [ -z "$client_pid" ] || { kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true; }
              [ -z "$server_pid" ] || { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
              kill "$turn_pid" 2>/dev/null || true
              wait "$turn_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            for attempt in $(seq 1 30); do
              if ! kill -0 "$turn_pid" 2>/dev/null; then cat "$turn_log" >&2; echo "local TURN server exited early" >&2; exit 1; fi
              if grep -Eqi "listener address.*127\.0\.0\.1|listening.*3478" "$turn_log"; then break; fi
              sleep 0.5
            done
            "$server" --listen 127.0.0.1:46000 --web-port 0 \
              --config-dir "$config" --password ci-e2e-password \
              --device-id ci-e2e-device --web-pass ci-e2e-web-password \
              >"$server_log" 2>&1 &
            server_pid=$!
            for attempt in $(seq 1 40); do
              if grep -Fq "RTP AEAD: 127.0.0.1:46000" "$server_log"; then break; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then cat "$server_log" >&2; echo "server exited before readiness" >&2; exit 1; fi
              sleep 0.5
            done
            grep -Fq "RTP AEAD: 127.0.0.1:46000" "$server_log"
            "$client" --peer 127.0.0.1:46000 --turn 127.0.0.1 --port 3478 \
              --vk ci-e2e-hash --vk-hash-mode manual --vk-auth-mode vkcalls \
              --password ci-e2e-password --device-id ci-e2e-device \
              --workers 9 --listen 127.0.0.1:9000 --turn-transport udp \
              >"$client_log" 2>&1 &
            client_pid=$!
            for attempt in $(seq 1 60); do
              if grep -Fq "[КЛИЕНТ] Tunnel IP:" "$client_log" && grep -Fq -- "-> TUNCONF" "$server_log"; then break; fi
              if ! kill -0 "$client_pid" 2>/dev/null; then cat "$client_log" >&2; echo "real Rust client exited before TUNCONF" >&2; exit 1; fi
              sleep 1
            done
            if ! grep -Fq "[КЛИЕНТ] Tunnel IP:" "$client_log" || ! grep -Fq -- "-> TUNCONF" "$server_log"; then
              echo "client did not complete authenticated TUNCONF before restart" >&2
              echo "--- client log ---" >&2; tail -n 100 "$client_log" >&2
              echo "--- server log ---" >&2; tail -n 100 "$server_log" >&2
              echo "--- TURN log ---" >&2; tail -n 60 "$turn_log" >&2
              exit 1
            fi
            client_pid_before=$client_pid
            before_count=$(grep -Fc -- "-> TUNCONF" "$server_log")
            test "$before_count" -gt 0
            kill "$server_pid"
            wait "$server_pid" 2>/dev/null || true
            server_pid=
            for attempt in $(seq 1 4); do
              if ! kill -0 "$client_pid" 2>/dev/null; then echo "client exited during server restart" >&2; exit 1; fi
              sleep 0.25
            done
            "$server" --listen 127.0.0.1:46000 --web-port 0 \
              --config-dir "$config" --password ci-e2e-password \
              --device-id ci-e2e-device --web-pass ci-e2e-web-password \
              >>"$server_log" 2>&1 &
            server_pid=$!
            recovered=0
            for attempt in $(seq 1 80); do
              if ! kill -0 "$client_pid" 2>/dev/null; then cat "$client_log" >&2; echo "client exited after server restart" >&2; exit 1; fi
              after_count=$(grep -Fc -- "-> TUNCONF" "$server_log" || true)
              if [ "$after_count" -gt "$before_count" ]; then recovered=1; break; fi
              sleep 1
            done
            if [ "$recovered" -ne 1 ]; then
              echo "same Rust client process did not re-establish GETCONF/TUNCONF after server restart" >&2
              echo "--- client log ---" >&2; tail -n 120 "$client_log" >&2
              echo "--- server log ---" >&2; tail -n 120 "$server_log" >&2
              echo "--- TURN log ---" >&2; tail -n 80 "$turn_log" >&2
              exit 1
            fi
            test "$client_pid" = "$client_pid_before"
            kill -0 "$client_pid"
            echo "PASS: native Rust client PID remained stable across server restart."
            echo "PASS: server recorded a new TUNCONF after restart from the same client process."
            cleanup
            trap - EXIT
          ' _ "$client" "$server" "$config" "$server_log" "$client_log" "$turn_log"
          echo "NATIVE_RUST_CLIENT_SAME_PROCESS_RECOVERY_PASS"

      - name: Verify process-level test prerequisites (not the recovery E2E)
        shell: bash
        run: |
          set -euo pipefail
          client="client-source/rust-client/target/x86_64-unknown-linux-gnu/debug/client"
          server="server-source/rust-server/target/x86_64-unknown-linux-gnu/debug/csqtt"
          test -x "$client"
          test -x "$server"
          test "$( "$server" --protocol-revision )" = "CSQTT-WIRE-3"
          # This CLI intentionally disables clap's generated --help flag.
          # Invoke it without required connection arguments and assert its own
          # validation path, rather than grepping for nonexistent help output.
          if "$client" > "$RUNNER_TEMP/client-startup.txt" 2>&1; then
            echo "client unexpectedly accepted missing required arguments" >&2
            exit 1
          fi
          grep -F -- 'Нужны -peer и хеши VK' "$RUNNER_TEMP/client-startup.txt"
          {
            echo "## Process recovery E2E status"
            echo "- PASS: pinned client and server executables build; client CLI starts; server reports CSQTT-WIRE-3."
            echo "- PASS: CI-only credential hook was applied only to the disposable pinned-client checkout."
            echo "- NOT RUN / NOT PASSED: authenticated client-server session, bidirectional TUN traffic, server restart, stable client PID, and bounded recovery timeout."
            echo "- The authenticated local TURN relay and deterministic isolated dataplane fixture are still required before this workflow can claim process recovery."
            echo "- No production services or network policies are changed. Previously passed TURN/worker tests were not repeated."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PROCESS_RECOVERY_E2E_NOT_YET_IMPLEMENTED"
