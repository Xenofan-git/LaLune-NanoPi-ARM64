name: CSQTT real client process recovery E2E (fixture work in progress)

on:
  push:
    branches:
      - test/csqtt-process-recovery-e2e

permissions:
  contents: read

jobs:
  process-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain and Linux test tools
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Fetch pinned client and server
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Endlad2/csqtt-core.git client-source
          git -C client-source checkout --detach 3eafb7ee868f5f2690edf3b0326153813f88eb5f
          git clone --depth 1 --branch v2.1.9 https://github.com/amurcanov/csqtt.git server-source
          test "$(git -C client-source rev-parse HEAD)" = "3eafb7ee868f5f2690edf3b0326153813f88eb5f"
          test "$(git -C server-source describe --tags --exact-match)" = "v2.1.9"
          cmp client-source/shared/wire_protocol.rs server-source/shared/wire_protocol.rs
          # Patch only the disposable pinned-client checkout. The normal
          # upstream VK auth path remains unchanged unless all three
          # CSQTT_TEST_TURN_* variables are explicitly supplied at runtime.
          python3 scripts/ci/patch-csqtt-process-e2e-auth.py
          grep -F 'CSQTT_TEST_TURN_USERNAME' client-source/rust-client/auth.rs

      - name: Build actual client and server executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-unknown-linux-gnu --manifest-path client-source/rust-client/Cargo.toml --bin client
          cargo build --locked --target x86_64-unknown-linux-gnu --manifest-path server-source/rust-server/Cargo.toml --bin csqtt
          test -x client-source/rust-client/target/x86_64-unknown-linux-gnu/debug/client
          test -x server-source/rust-server/target/x86_64-unknown-linux-gnu/debug/csqtt

      - name: Start and stop the actual server in an isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          server="$GITHUB_WORKSPACE/server-source/rust-server/target/x86_64-unknown-linux-gnu/debug/csqtt"
          config="$RUNNER_TEMP/csqtt-e2e-config"
          log="$RUNNER_TEMP/csqtt-server-startup.log"
          mkdir -p "$config"
          # The namespace supervisor owns the child server and always reaps it.
          # A bounded timeout prevents a cleanup regression from hanging the job.
          sudo timeout --signal=TERM --kill-after=3s 25s unshare --net --fork --mount-proc bash -euc '
            ip link set lo up
            "$1" --listen 127.0.0.1:46000 --web-port 0 \
              --config-dir "$2" --password ci-e2e-password \
              --device-id ci-e2e-device --web-pass ci-e2e-web-password &
            server_pid=$!
            cleanup() {
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            }
            trap cleanup EXIT TERM INT
            ready=0
            for attempt in $(seq 1 40); do
              if grep -Fq "RTP AEAD: 127.0.0.1:46000" "$3"; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$3"
                echo "isolated CSQTT server exited before becoming ready" >&2
                exit 1
              fi
              sleep 0.5
            done
            if [ "$ready" -ne 1 ]; then
              cat "$3"
              echo "isolated CSQTT server did not report its UDP listener" >&2
              exit 1
            fi
            grep -F "RTP AEAD: 127.0.0.1:46000" "$3"
            echo "PASS: real CSQTT server process started in a private network namespace."
            cleanup
            trap - EXIT TERM INT
          ' _ "$server" "$config" "$log" >"$log" 2>&1
          grep -F 'PASS: real CSQTT server process started in a private network namespace.' "$log"
          echo "PASS: isolated server namespace exited and cleanup completed."

      - name: Verify process-level test prerequisites (not the recovery E2E)
        shell: bash
        run: |
          set -euo pipefail
          client="client-source/rust-client/target/x86_64-unknown-linux-gnu/debug/client"
          server="server-source/rust-server/target/x86_64-unknown-linux-gnu/debug/csqtt"
          test -x "$client"
          test -x "$server"
          test "$( "$server" --protocol-revision )" = "CSQTT-WIRE-3"
          # This CLI intentionally disables clap's generated --help flag.
          # Invoke it without required connection arguments and assert its own
          # validation path, rather than grepping for nonexistent help output.
          if "$client" > "$RUNNER_TEMP/client-startup.txt" 2>&1; then
            echo "client unexpectedly accepted missing required arguments" >&2
            exit 1
          fi
          grep -F -- 'Нужны -peer и хеши VK' "$RUNNER_TEMP/client-startup.txt"
          {
            echo "## Process recovery E2E status"
            echo "- PASS: pinned client and server executables build; client CLI starts; server reports CSQTT-WIRE-3."
            echo "- PASS: CI-only credential hook was applied only to the disposable pinned-client checkout."
            echo "- NOT RUN / NOT PASSED: authenticated client-server session, bidirectional TUN traffic, server restart, stable client PID, and bounded recovery timeout."
            echo "- The authenticated local TURN relay and deterministic isolated dataplane fixture are still required before this workflow can claim process recovery."
            echo "- No production services or network policies are changed. Previously passed TURN/worker tests were not repeated."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PROCESS_RECOVERY_E2E_NOT_YET_IMPLEMENTED"
