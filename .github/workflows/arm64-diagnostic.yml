name: ARM64 workflow diagnostic

on:
  push:
    branches:
      - original-lalune-linux-arm64-policy
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "workflow syntax OK"
          echo "SHA=$GITHUB_SHA"
          test -f .github/workflows/build-original-linux-arm64.yml
          sed -n '1,40p' .github/workflows/build-original-linux-arm64.yml
