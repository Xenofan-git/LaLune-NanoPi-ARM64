name: Build LaLune Linux ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: e4a6d08b63aef6025bf8ad8f77da660ea552e04b
  FLUTTER_VERSION: 3.47.2
  GO_VERSION: "1.26.0"

jobs:
  flutter-web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned upstream
        uses: actions/checkout@v5
        with:
          repository: Endlad2/LaLune
          ref: e4a6d08b63aef6025bf8ad8f77da660ea552e04b
          path: upstream
      - name: Setup Flutter x64
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          architecture: x64
          cache: true
      - name: Build Flutter Web frontend
        working-directory: upstream/Frontend/Core
        run: |
          flutter --version
          flutter pub get
          flutter build web --release
      - name: Upload Flutter Web
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: upstream/Frontend/Core/build/web

  linux-arm64:
    needs: flutter-web
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v5
      - name: Checkout pinned upstream
        uses: actions/checkout@v5
        with:
          repository: Endlad2/LaLune
          ref: e4a6d08b63aef6025bf8ad8f77da660ea552e04b
          path: upstream
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev curl unzip zip xz-utils
      - name: Setup Go ARM64
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: |
            upstream/Desktop/Linux/go.sum
            Gateway/go.mod
      - name: Download Flutter Web frontend
        uses: actions/download-artifact@v5
        with:
          name: flutter-web
          path: upstream/Frontend/output
      - name: Prepare SmartTunnel runtime library
        working-directory: upstream
        run: python3 prepare_st.py --platform=Linux
      - name: Stage Wails Linux sources
        working-directory: upstream
        run: |
          mkdir -p Desktop/Linux/frontend Desktop/Linux/Libs
          cp -a Frontend/output/. Desktop/Linux/frontend/
          cp -a Desktop/Libs/. Desktop/Linux/Libs/
          test -f Desktop/Linux/frontend/index.html
          test -f Desktop/Linux/Libs/SmartTunnel.lua
          test -f Desktop/Linux/Libs/smarttunnel.go
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Linux ARM64 desktop
        working-directory: upstream/Desktop/Linux
        run: |
          go mod download
          wails doctor || true
          wails build -clean -platform linux/arm64 -tags webkit2_41 -o LaLune
      - name: Build NanoPi headless gateway
        working-directory: Gateway
        run: |
          gofmt -w main.go
          go test ./...
          mkdir -p ../dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../dist/lalune-gateway
      - name: Assemble artifacts
        run: |
          mkdir -p dist/lalune-gateway-bundle
          cp upstream/Desktop/Linux/build/bin/LaLune dist/LaLune-linux-arm64
          cp Gateway/lalune-gateway.service dist/lalune-gateway-bundle/
          cp Gateway/install.sh dist/lalune-gateway-bundle/
          cp dist/lalune-gateway dist/lalune-gateway-bundle/
          cp Gateway/README.md dist/lalune-gateway-bundle/
          tar -C dist -czf dist/LaLune-NanoPi-gateway-arm64.tar.gz lalune-gateway-bundle
          file dist/LaLune-linux-arm64 dist/lalune-gateway
          sha256sum dist/LaLune-linux-arm64 dist/lalune-gateway dist/LaLune-NanoPi-gateway-arm64.tar.gz
      - name: Upload desktop ARM64
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-linux-arm64
          path: dist/LaLune-linux-arm64
          if-no-files-found: error
      - name: Upload NanoPi gateway bundle
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-NanoPi-gateway-arm64
          path: dist/LaLune-NanoPi-gateway-arm64.tar.gz
          if-no-files-found: error
