name: Build LaLune Linux ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: e4a6d08
  FLUTTER_VERSION: 3.47.2
  GO_VERSION: "1.25.0"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v5

      - name: Checkout pinned upstream
        uses: actions/checkout@v5
        with:
          repository: Endlad2/LaLune
          ref: e4a6d08b63aef6025bf8ad8f77da660ea552e04b
          path: upstream

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev curl unzip zip xz-utils

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: upstream/Desktop/Linux/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Flutter frontend
        working-directory: upstream
        run: |
          flutter --version
          cd Frontend/Core
          flutter pub get
          flutter build web --release

      - name: Prepare Wails frontend output
        working-directory: upstream
        run: |
          rm -rf Frontend/output
          mkdir -p Frontend/output
          cp -a Frontend/Core/build/web/. Frontend/output/

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Linux ARM64
        working-directory: upstream/Desktop/Linux
        run: |
          go mod download
          wails doctor
          wails build -clean -platform linux/arm64 -o LaLune

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp upstream/Desktop/Linux/build/bin/LaLune dist/LaLune-linux-arm64
          file dist/LaLune-linux-arm64
          sha256sum dist/LaLune-linux-arm64

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-linux-arm64
          path: dist/LaLune-linux-arm64
          if-no-files-found: error