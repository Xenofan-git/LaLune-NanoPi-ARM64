name: CSQTT isolated Rust recovery-harness groundwork

on:
  push:
    branches:
      - test/csqtt-rust-recovery-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-turn-session-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned CSQTT client source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Endlad2/csqtt-core.git upstream-csqtt-core
          git -C upstream-csqtt-core checkout --detach 3eafb7ee868f5f2690edf3b0326153813f88eb5f
          test "$(git -C upstream-csqtt-core rev-parse HEAD)" = "3eafb7ee868f5f2690edf3b0326153813f88eb5f"
          python3 scripts/ci/patch-csqtt-local-turn-auth.py
      - name: List tests and run focused local TURN integration tests
        working-directory: upstream-csqtt-core/rust-client
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --bin client -- --list > /tmp/csqtt-test-list.txt
          grep -F 'authenticated_flow_survives_pool_deficit_and_keeps_channel_data_zero_copy' /tmp/csqtt-test-list.txt
          grep -F 'tcp_turn_transport_allocates_without_udp_fallback' /tmp/csqtt-test-list.txt
          cargo test --locked --bin client authenticated_flow_survives_pool_deficit_and_keeps_channel_data_zero_copy -- --nocapture
          cargo test --locked --bin client tcp_turn_transport_allocates_without_udp_fallback -- --nocapture
          grep -E 'test result: ok\. [1-9][0-9]* passed' /tmp/csqtt-test-results.txt >/dev/null 2>&1 && echo "Results captured" || true
      - name: Explicitly record missing acceptance gate
        run: |
          {
            echo "## Scope"
            echo "- Pinned Rust TURN/session tests plus worker reconnect scheduling tests."
            echo "- Test listing is checked before execution, and substring filters are used."
            echo "- No VK secret or token is used or printed."
            echo "- No production device, VPS, router, firewall, DNS, or tunnel is touched."
            echo "- This does not claim that the stock Rust client process survives a server restart."
            echo "- The disposable source checkout receives a test-only local TURN credential hook; no credentials are supplied by this foundation workflow."
            echo "- Full acceptance still requires a local CSQTT test server, a real client process, stable PID, and bidirectional TUN traffic before/after server restart."
          } >> "$GITHUB_STEP_SUMMARY"
