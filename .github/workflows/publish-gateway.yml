name: Publish NanoPi LaLune gateway

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: Gateway/go.mod
      - name: Build gateway
        working-directory: Gateway
        run: |
          gofmt -w main.go
          go test ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../lalune-gateway-linux-arm64
          sha256sum ../lalune-gateway-linux-arm64
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nanopi-gateway-build
          name: LaLune NanoPi Gateway build
          generate_release_notes: false
          files: lalune-gateway-linux-arm64
          overwrite_files: true
