name: Validate VK Calls hash secret

on:
  workflow_dispatch:
  push:
    branches:
      - fix/production-recovery-single-artifact
    paths:
      - ".github/workflows/vk-hash-secret-validation.yml"

permissions:
  contents: read

jobs:
  validate-vk-calls-hash:
    name: Validate VK_CALL_HACH_1 against VK Calls
    # Use the same ARM64 executable shipped by the NanoPi Gateway.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Download the pinned CSQTT ARM64 core
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/Endlad2/csqtt-core/releases/download/2026.09.16.17.59/client-linux-arm64" \
            --output "$RUNNER_TEMP/client-linux-arm64"
          echo "9a5b917665fda6ee7b3cf8439e3194d46c763f2305d188b4962caee69048ae31  $RUNNER_TEMP/client-linux-arm64" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/client-linux-arm64"

      - name: Validate the saved VK Calls hash (manual mode)
        env:
          VK_CALL_HACH_1: ${{ secrets.VK_CALL_HACH_1 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${VK_CALL_HACH_1:-}" ]]; then
            echo "::error::GitHub Actions secret VK_CALL_HACH_1 is missing or empty."
            exit 1
          fi

          # The core has a dedicated validation-only mode. It checks VK hash
          # validity and exits before peer/password/server connection setup.
          # Its structured output includes the supplied hash, so capture it
          # privately and emit only the status/count below.
          result_file="$RUNNER_TEMP/vk-hash-check.jsonl"
          set +e
          "$RUNNER_TEMP/client-linux-arm64" \
            --vk "$VK_CALL_HACH_1" \
            --vk-hash-mode manual \
            --validate-vk-hashes >"$result_file" 2>&1
          core_status=$?
          set -e
          unset VK_CALL_HACH_1

          python3 - "$result_file" "$core_status" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          core_status = int(sys.argv[2])
          results = []
          for line in path.read_text(errors="replace").splitlines():
              marker = "HASH_CHECK:"
              if marker not in line:
                  continue
              payload = line.split(marker, 1)[1].strip()
              try:
                  item = json.loads(payload)
              except json.JSONDecodeError:
                  continue
              status = item.get("status")
              if status in {"valid", "invalid", "unavailable"}:
                  results.append(status)

          if not results:
              print("VK hash validation: no structured result returned.")
              raise SystemExit(core_status or 2)

          print(f"VK hash validation results: {len(results)}")
          for status in results:
              print(f"- {status}")
          if any(status == "invalid" for status in results):
              raise SystemExit(1)
          if any(status == "unavailable" for status in results):
              raise SystemExit(2)
          if core_status != 0:
              print(f"CSQTT validator exited with status {core_status}.")
              raise SystemExit(core_status)
          print("VK Calls hash accepted by the validator.")
          PY

          rm -f "$result_file"
